<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<title>Patate Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one phone-sized column of chunky "sticker" cards on a sunny dotted table; one screen per game step. */
/* Deliberately single-theme: a bright toy-box look that reads the same on any host background. */
:root {
  --sun: #FFD23F;
  --sun-deep: #F5B700;
  --ink: #1E1B3A;
  --paper: #FFFDF5;
  --tomato: #FF5A36;
  --mint: #22C3A6;
  --sky: #5BC0EB;
  --pink: #FF8FB1;
  --grape: #9B6BFF;
  --throat: #7A1E33;
  --muted: #5E5878;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--sun);
  background-image: radial-gradient(var(--sun-deep) 2px, transparent 2.5px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 800;
  font-size: 17px;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
#app {
  max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 96px;
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.05; }
p { margin: 0; line-height: 1.4; }

.card {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px;
  box-shadow: 0 6px 0 var(--ink); padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.btn {
  font-family: var(--display); font-size: 1.6rem; letter-spacing: .02em;
  color: var(--ink); background: var(--mint);
  border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink);
  padding: 14px 18px; cursor: pointer; width: 100%;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, .ava:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
.btn.red { background: var(--tomato); color: var(--paper); }
.btn.pink { background: var(--pink); }
.btn.sky { background: var(--sky); }
.btn.white { background: var(--paper); }
.btn.small { font-size: 1.15rem; padding: 10px 14px; }

/* ---------- Logo ---------- */
.logo { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; }
.logo .spud { font-size: 4.6rem; line-height: 1; animation: wobble 2.4s ease-in-out infinite; display: inline-block; }
.logo h1 { font-size: 3.3rem; color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); transform: rotate(-3deg); }
.logo p { color: var(--ink); font-size: 1rem; }
@keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.06); } }

/* ---------- Setup ---------- */
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.prow { display: grid; grid-template-columns: 50px minmax(0,1fr) auto auto; gap: 6px; align-items: center; }
.ava {
  width: 50px; height: 50px; font-size: 1.8rem; border-radius: 16px;
  border: 3px solid var(--ink); background: var(--sun); cursor: pointer; padding: 0;
  display: grid; place-items: center;
}
.prow input {
  min-width: 0; width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px; padding: 10px; background: #fff;
  -webkit-user-select: text; user-select: text;
}
.chip {
  font: inherit; font-size: .95rem; border: 3px solid var(--ink); border-radius: 999px;
  padding: 8px 12px; background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--ink); color: var(--paper); }
.chip.kid.on { background: var(--pink); color: var(--ink); }
.chip.x { padding: 8px 9px; }
.prow .chip { padding: 8px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Round intro ---------- */
.eyebrow { font-family: var(--display); font-size: 1.1rem; background: var(--ink); color: var(--sun); align-self: center; padding: 6px 14px; border-radius: 999px; }
.bigicon { font-size: 6rem; text-align: center; line-height: 1; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: none; } }
.title { font-size: 2.5rem; text-align: center; }
.rules { font-size: 1.15rem; }
.center { text-align: center; }

/* ---------- Player chips & lists ---------- */
.who { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 1.5rem; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.pick .btn { font-size: 1.2rem; padding: 12px 8px; background: var(--paper); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pick .btn .e { font-size: 2.2rem; line-height: 1; }
.pick .btn.on { background: var(--mint); }
.pick .btn .nm { overflow-wrap: anywhere; }

/* ---------- Grands dessins ---------- */
.secret { font-size: 7rem; text-align: center; line-height: 1.1; }
.secret-text { font-family: var(--display); font-size: 2rem; text-align: center; }
.ring { width: 150px; height: 150px; margin: 0 auto; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 3.4rem; font-variant-numeric: tabular-nums; }
.shush { font-size: 1.3rem; text-align: center; }

/* ---------- Patate ---------- */
.cat { font-family: var(--display); font-size: 2.1rem; text-align: center; background: var(--ink); color: var(--sun); border-radius: 18px; padding: 12px; }
.potato {
  font-size: 9rem; line-height: 1; background: none; border: 0; cursor: pointer; padding: 10px;
  display: block; margin: 0 auto; filter: drop-shadow(0 8px 0 rgba(30,27,58,.35));
  touch-action: manipulation;
}
.potato.shake { animation: shake var(--spd, .5s) linear infinite; }
@keyframes shake { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-9deg) translateX(-4px) } 75% { transform: rotate(9deg) translateX(4px) } }
.boom { font-size: 8rem; text-align: center; animation: boom .6s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes boom { from { transform: scale(.1); } to { transform: scale(1); } }
.flash { position: fixed; inset: 0; background: var(--paper); pointer-events: none; animation: flash .5s ease-out forwards; z-index: 40; }
@keyframes flash { from { opacity: 1 } to { opacity: 0 } }
.gage { background: var(--pink); border: 3px solid var(--ink); border-radius: 18px; padding: 14px; font-size: 1.35rem; text-align: center; }

/* ---------- Défi ---------- */
.order { display: flex; flex-direction: column; gap: 8px; }
.order .it { display: flex; align-items: center; gap: 10px; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; background: var(--paper); font-size: 1.2rem; }
.order .it .e { font-size: 1.8rem; }
.order .it.now { background: var(--mint); transform: scale(1.03); }
.order .it.done { opacity: .45; }
.countdown { font-family: var(--display); font-size: 8rem; text-align: center; line-height: 1; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }

/* ---------- Tape ---------- */
.tomato {
  width: min(78vw, 320px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; display: grid; place-items: center;
  font-size: min(48vw, 200px); line-height: 1; border-radius: 50%;
  background: radial-gradient(circle, #fff6 0 40%, transparent 41%);
  border: 0; cursor: pointer; touch-action: none; padding: 0;
}
.tomato.hit { animation: squish .12s ease-out; }
@keyframes squish { 50% { transform: scale(.86, .78); } }
.counter { font-family: var(--display); font-size: 4rem; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 14px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tomato); width: 100%; transition: width .1s linear; }

/* ---------- Scores ---------- */
.score-row { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.score-row .e { font-size: 2rem; text-align: center; }
.score-row .nm { font-size: 1.15rem; overflow-wrap: anywhere; }
.score-row .pts { font-family: var(--display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.score-row .delta { font-family: var(--display); color: var(--mint); -webkit-text-stroke: 1px var(--ink); margin-left: 6px; font-size: 1.3rem; }
.sbar { grid-column: 2 / 4; height: 12px; border-radius: 999px; background: #EFE9D6; overflow: hidden; margin-top: -6px; }
.sbar > i { display: block; height: 100%; background: var(--grape); border-radius: 999px; transition: width .8s cubic-bezier(.3,1.4,.5,1); }

/* ---------- Podium ---------- */
.crown { font-size: 3rem; text-align: center; margin-bottom: -18px; animation: wobble 1.6s ease-in-out infinite; }
.champ { font-size: 6.5rem; text-align: center; line-height: 1; }
.award { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 10px; align-items: center; }
.award .e { font-size: 2rem; text-align: center; }
.award small { display: block; color: var(--muted); font-size: .95rem; }

/* ---------- Floating prout button ---------- */
.prout {
  position: fixed; z-index: 30;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 66px; height: 66px; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--grape); box-shadow: 0 5px 0 var(--ink);
  font-size: 2rem; cursor: pointer; display: grid; place-items: center; padding: 0;
}
.prout:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.prout.puff { animation: puff .4s ease-out; }
@keyframes puff { 40% { transform: scale(1.25) rotate(12deg); } }
.cloud { position: fixed; z-index: 29; pointer-events: none; font-size: 2.4rem; animation: cloud 1.1s ease-out forwards; }
@keyframes cloud { to { transform: translate(-60px, -140px) scale(2.2); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 35; width: 100%; height: 100%; }
.tiny { font-size: .9rem; color: var(--muted); text-align: center; }

/* ---------- Ballon ---------- */
.balloon-wrap { height: 280px; display: grid; place-items: center; overflow: hidden; }
.wob { animation: wob var(--spd, 1.2s) ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wob { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.balloon { font-size: 5rem; line-height: 1; transition: transform .25s cubic-bezier(.3,1.8,.5,1); transform-origin: 50% 80%; }
.pumps { display: flex; justify-content: center; gap: 10px; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
.dot.on { background: var(--sky); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.btn:disabled { opacity: .45; }

/* ---------- Croco ---------- */
.croc { background: var(--mint); border: 3px solid var(--ink); border-radius: 48px 48px 28px 28px; box-shadow: 0 6px 0 var(--ink); padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.croc .eyes { font-size: 2.6rem; text-align: center; line-height: 1; }
.mouth { background: var(--throat); border: 3px solid var(--ink); border-radius: 22px; padding: 10px; display: flex; flex-direction: column; gap: 56px; transition: gap .12s ease-in; }
.teeth { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.tooth { aspect-ratio: 3 / 4; background: var(--paper); border: 3px solid var(--ink); cursor: pointer; padding: 0; }
.top .tooth { border-radius: 8px 8px 50% 50%; }
.bot .tooth { border-radius: 50% 50% 8px 8px; }
.tooth.gone { visibility: hidden; }
.tooth.bad { background: var(--tomato); visibility: visible; }
.croc.snap .mouth { gap: 0; }
.croc.snap { animation: shake .12s linear 4; }

/* ---------- Main Éclair ---------- */
.arena {
  position: fixed; inset: 0; z-index: 25; background: var(--ink);
  display: grid; gap: 6px; touch-action: none;
  padding: calc(6px + env(safe-area-inset-top, 0px)) calc(6px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(6px + env(safe-area-inset-left, 0px));
}
.zone { border: 0; border-radius: 22px; display: grid; place-items: center; font: inherit; color: var(--ink); cursor: pointer; position: relative; touch-action: none; padding: 0; }
.zin { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ze { font-size: 3rem; line-height: 1; }
.zn { font-family: var(--display); font-size: 1.4rem; }
.zs { min-height: 1.4em; font-size: 1.1rem; }
.zone.frozen { filter: grayscale(1) brightness(.6); }
.zone.frozen::after { content: "🥶"; position: absolute; font-size: 2.6rem; top: 10px; left: 50%; transform: translateX(-50%); }
.zone.win { animation: winz .45s ease-in-out 2; }
@keyframes winz { 50% { transform: scale(.94); filter: brightness(1.25); } }
.signal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 26; pointer-events: none;
  width: 150px; height: 150px; border-radius: 50%; background: var(--paper); border: 5px solid var(--ink);
  box-shadow: 0 0 0 8px var(--sun); display: grid; place-items: center; font-size: 4.8rem; line-height: 1;
}
.signal small { position: absolute; bottom: 12px; font-size: .85rem; font-family: var(--body); color: var(--muted); }
.signal .se { display: inline-block; }
.signal .se.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }

/* ---------- Double Vue ---------- */
.vwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vwrap.nope { animation: shake .1s linear 3; }
.vcard { position: relative; width: min(64vw, 33vh, 270px); max-width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.sym { position: absolute; background: none; border: 0; padding: 4px; line-height: 1; cursor: pointer; touch-action: manipulation; }

/* ---------- Ferme Folle ---------- */
.farm { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; width: 100%; max-width: 340px; margin: 0 auto; }
.fbtn { aspect-ratio: 1; font-size: 4rem; border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; padding: 0; transition: transform .1s, filter .1s; }
.fbtn.lit { transform: scale(1.08); filter: brightness(1.2) saturate(1.3); box-shadow: 0 0 0 6px var(--paper), 0 6px 0 var(--ink); }

/* ---------- Jacques a dit / Dis-en 3 ---------- */
.order-card { font-family: var(--display); font-size: 2.1rem; text-align: center; line-height: 1.1; }
.jq-yes { color: var(--mint); -webkit-text-stroke: 1px var(--ink); }
.big-num { font-family: var(--display); font-size: 6rem; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- Choix des mini-jeux ---------- */
.gpick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.gtile {
  display: flex; align-items: center; gap: 8px; text-align: left; min-width: 0;
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 16px; padding: 8px 10px; cursor: pointer; position: relative;
}
.gtile .gi { font-size: 1.7rem; line-height: 1; flex: none; }
.gtile .gn { overflow-wrap: anywhere; line-height: 1.15; }
.gtile.on { background: var(--mint); box-shadow: 0 4px 0 var(--ink); }
.gtile:not(.on) { opacity: .5; }
.gtile:not(.on) .gi { filter: grayscale(1); }
.gtile:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
.warn { color: var(--tomato); font-size: .95rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>

<main id="app" aria-live="polite"></main>
<button class="prout" id="prout" aria-label="Bouton prout">💨</button>
<canvas id="confetti"></canvas>

<script>
(() => {
'use strict';

const CATS = [
  ['🐾','Un animal'], ['🍕','Un truc qui se mange'], ['💛','Un truc jaune'],
  ['🍳','Un truc dans la cuisine'], ['🦸','Un super-héros'], ['🧦','Un truc qui pue'],

const DEFIS = [
  ['👹','La grimace de monstre la plus effrayante'], ['🦍','Le meilleur cri de Tarzan'],
  ['😈','Le meilleur rire de méchant'], ['🐔','La meilleure imitation de poule'],
  ['💃','Le pas de danse le plus ridicule'], ['🤖','Dire « Je veux des frites » avec une voix de robot'],

let frVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    frVoice = vs.find(v => /^fr(-|_)FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;

}
try { if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch (e) {}
function say(text, force) {
  if ((!S.tts && !force) || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const clean = String(text).replace(/\p{Extended_Pictographic}|‍|️/gu, '').replace(/·/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'fr-FR'; u.rate = 1; u.pitch = 1.15;
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ====================== Sons (synthétisés) ====================== */
let AC = null;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}
function tone(f1, f2, dur, type = 'sine', vol = .25, delay = 0) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, f1, f2, vol = .5) {
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}
const SFX = {
  pop:    () => tone(500 + rnd(300), 1300, .07, 'sine', .2),
  boing:  () => { tone(180, 520, .25, 'sine', .3); tone(520, 300, .2, 'triangle', .12, .2); },
  tick:   () => tone(1100, 1100, .04, 'square', .08),
  tock:   () => tone(700, 700, .04, 'square', .08),
  boom:   () => { noise(1.4, 4000, 60, .9); tone(120, 30, .8, 'sawtooth', .4); },
  buzzer: () => { tone(160, 140, .5, 'sawtooth', .25); tone(165, 145, .5, 'square', .1); },
  yay:    () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .18, 'triangle', .25, i * .11)),
  fanfare:() => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, f, i === 6 ? .6 : .16, 'triangle', .28, i * .14)),
  beep:   () => tone(660, 660, .12, 'square', .12),
  go:     () => tone(990, 990, .3, 'square', .15),
  squeak: k => { const f = 260 + k * 35; tone(f, f * 1.3, .12, 'triangle', .22); },
  pan:    () => { noise(.45, 8000, 300, 1); tone(900, 200, .15, 'square', .2); },
  snap:   () => { tone(420, 60, .2, 'sawtooth', .45); noise(.25, 3000, 200, .8); },
  growl:  () => tone(75, 55, .5, 'sawtooth', .2),
  ding:   () => { tone(880, 880, .08, 'triangle', .25); tone(1320, 1320, .15, 'triangle', .25, .08); },
  fart() {
    const c = ac(); if (!c) return;
    const t = c.currentTime, dur = .45 + Math.random() * .8, base = 55 + Math.random() * 55;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(base * 1.2, t); o.frequency.exponentialRampToValueAtTime(base * .7, t + dur);
    const lfo = c.createOscillator(); lfo.frequency.value = 14 + Math.random() * 22;
    const lg = c.createGain(); lg.gain.value = base * .5; lfo.connect(lg); lg.connect(o.frequency);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 350 + Math.random() * 350; f.Q.value = 6;
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7, t + .03);
    g.gain.setValueAtTime(.6, t + dur * .75); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
    if (Math.random() < .35) tone(base * 3, base * 1.5, .12, 'sawtooth', .15, dur); // le petit « pfft » final
  }
};

/* ====================== Confettis ====================== */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], confRaf = 0;
function confetti(n = 160) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ['#FF5A36', '#22C3A6', '#5BC0EB', '#FF8FB1', '#9B6BFF', '#FFFDF5'];
  for (let i = 0; i < n; i++) parts.push({
    x: Math.random() * cv.width, y: -Math.random() * cv.height * .5,
    vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
    w: (6 + Math.random() * 8) * devicePixelRatio, h: (10 + Math.random() * 10) * devicePixelRatio, c: cols[rnd(cols.length)]
  });
  if (!confRaf) confRaf = requestAnimationFrame(stepConf);
}
function stepConf() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.y < cv.height + 40);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += .04;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  confRaf = parts.length ? requestAnimationFrame(stepConf) : 0;
}

const picked = () => (S.picked || Object.keys(GAMES)).filter(k => k in GAMES);
const roundCount = () => S.rounds || picked().length;
function buildPlan(n) {
  const types = picked(), plan = [];
  while (plan.length < n) {
    let s = shuffle(types);
    if (plan.length && s[0] === plan[plan.length - 1]) s.push(s.shift());
    plan.push(...s);
  }
  const out = plan.slice(0, n);
  if (types.includes('patate') && !out.includes('patate')) out[rnd(n)] = 'patate';  // la patate est toujours de la fête
  return out;
}
function startGame() {
  S.players.forEach(p => { p.score = 0; if (!p.name.trim()) p.name = 'Joueur'; });
  save();
  if (!picked().length) return;
  S.plan = buildPlan(roundCount()); S.round = 0;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  go('intro');
}
function startRound() {
  S.last = {};
  const type = S.plan[S.round];
  const n = S.players.length;
  const first = rnd(n);
  S.R = { type, order: Array.from({ length: n }, (_, i) => (first + i) % n), step: 0 };
  if (type === 'ballon') { S.R.booms = 0; go('ballonReady'); }
  if (type === 'croco') { S.R.booms = 0; go('crocoReady'); }
  if (type === 'reflexe') { S.R.target = draw('target', TARGETS); go('reflexReady'); }
  if (type === 'chrono') { S.R.times = {}; go('chronoPass'); }
  if (type === 'vue') { S.R.vue = {}; go('vuePass'); }
  if (type === 'trois') go('troisPass');
  if (type === 'ferme') { S.R.booms = 0; go('fermeReady'); }
  if (type === 'jacques') {
    const flags = shuffle([1, 1, 1, 1, 1, 0, 0, 0]);
    S.R.jq = { k: 0, errors: {}, list: flags.map(j => ({ j: !!j, o: draw('ordre', ORDRES) })) };
    go('jacquesPlay');
  }
  if (type === 'patate') { S.R.booms = 0; go('patateReady'); }
  if (type === 'defi') { S.R.defi = draw('defi', DEFIS); go('defiPlay'); }
  if (type === 'tape') { S.R.way = draw('tap', TAP_WAYS); S.R.taps = {}; go('tapePass'); }
}
function give(i, pts) { S.players[i].score += pts; S.last[i] = (S.last[i] || 0) + pts; }

}

    <p style="font-size:1.25rem">Trouve le dessin qui est sur <b>les deux cartes</b> et tape dessus !</p>
    <p class="tiny">${vueTime(curP())} secondes. Si tu te trompes, tu es bloqué 1 seconde.</p>
  </section>
  <button class="btn sky" data-a="vue-ready">Je suis prêt·e ! 👀</button>`;
AFTER.vuePass = () => say(`Au tour de ${nameOf(curP())} ! Trouve le dessin qui est sur les deux cartes.`);
VIEWS.vueGo = () => `
  <div class="row2" style="align-items:center">
    <div class="counter" id="vcnt" style="font-size:3rem">0</div>
    <div class="bar"><i id="vbar"></i></div>
  </div>
  <div class="vwrap" id="vwrap"></div>`;
AFTER.vueGo = () => {
  hush(); SFX.go();
  const dur = vueTime(curP()) * 1000, start = performance.now(), wrap = $('#vwrap');
  let score = 0, lockUntil = 0, done = false, pair;
  const deal = () => { pair = newPair(); wrap.innerHTML = vcard(pair.a) + vcard(pair.b); };
  wrap.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-s]'); if (!b || done) return;
    e.preventDefault();
    if (performance.now() < lockUntil) return;
    if (b.dataset.s === pair.common) { score++; $('#vcnt').textContent = score; SFX.ding(); buzz(30); deal(); }
    else {
      SFX.buzzer(); buzz(120); lockUntil = performance.now() + 1000;
      wrap.classList.remove('nope'); void wrap.offsetWidth; wrap.classList.add('nope');
    }
  });
  deal();
  every(() => {
    const left = Math.max(0, dur - (performance.now() - start));
    $('#vbar').style.width = (left / dur * 100) + '%';
    if (left <= 0 && !done) { done = true; SFX.buzzer(); S.R.vue[S.R.order[S.R.step]] = score; later(() => go('vueDone'), 500); }
  }, 50);
};
VIEWS.vueDone = () => {
  const i = S.R.order[S.R.step], n = S.R.vue[i], last = S.R.step + 1 >= S.players.length;
  return `
    <div class="bigicon" aria-hidden="true">👀</div>
    <section class="card center">
      <div>${tag(S.players[i])}</div>
      <div class="counter">${n}</div>
      <p>paire${n > 1 ? 's' : ''} trouvée${n > 1 ? 's' : ''} !</p>
    </section>
    <button class="btn sky" data-a="vue-next">${last ? 'Le classement ! 🏆' : 'Joueur suivant ➜'}</button>`;
};
AFTER.vueDone = () => { const n = S.R.vue[S.R.order[S.R.step]]; say(`${n} paire${n > 1 ? 's' : ''} ! Bravo ${nameOf(curP())} !`); };

/* ---------- Dis-en 3 ! ---------- */
const troisP = () => S.players[S.R.order[S.R.step % S.players.length]];
const troisTime = p => (hasKids() && hasGrown()) ? (p.kid ? 10 : 5) : 7;
VIEWS.troisPass = () => `
  <span class="eyebrow">🖐️ Tour ${S.R.step + 1} sur ${S.players.length * 2}</span>
  <section class="card center">
    <p>Passe le téléphone à</p>
    <div>${tag(troisP())}</div>
    <p style="font-size:1.25rem">Tu auras <b>${troisTime(troisP())} secondes</b> pour dire 3 réponses !</p>
    <p class="tiny">Les autres écoutent et jugent.</p>
  </section>
  <button class="btn pink" data-a="trois-ready">Je suis prêt·e ! 🖐️</button>`;
VIEWS.troisGo = () => `
  <section class="card center">
    <div class="secret" style="font-size:4.5rem" aria-hidden="true">${S.R.trois[0]}</div>
    <p class="secret-text">${esc(S.R.trois[1])}</p>
  </section>
  <div class="big-num" id="tnum">…</div>
  <button class="btn pink" data-a="trois-stop">J’en ai dit 3 ! ✋</button>`;
AFTER.troisGo = () => {
  say(S.R.trois[1] + ' !', true);
  let left = troisTime(troisP());
  later(() => {
    const num = $('#tnum'); if (num) num.textContent = left; SFX.go();
    every(() => {
      left--;
      const n = $('#tnum'); if (n) n.textContent = Math.max(left, 0);
      if (left > 0) SFX.tick();
      else { SFX.buzzer(); buzz(300); go('troisJudge'); }
    }, 1000);
  }, 1600);
};
VIEWS.troisJudge = () => `
  <div class="bigicon" aria-hidden="true">🧑‍⚖️</div>
  <h2 class="title">Les juges, alors ?</h2>
  <section class="card center">
    <div>${tag(troisP())}</div>
    <p style="font-size:1.2rem">${esc(S.R.trois[1])}</p>
  </section>
  <div class="row2">
    <button class="btn" data-a="trois-yes">✓ Réussi !</button>
    <button class="btn white" data-a="trois-no">✗ Raté</button>
  </div>`;
AFTER.troisJudge = () => say(`Les juges : est-ce que ${nameOf(troisP())} a réussi ?`);
function troisAdvance() {
  S.R.step++;
  if (S.R.step < S.players.length * 2) go('troisPass'); else endRound();
}

/* ---------- La Ferme Folle ---------- */
VIEWS.fermeReady = () => circleReady('🐮', 'Ferme', 'ferme-go', 'Ouvrir la ferme ! 🐮', '');
VIEWS.fermePlay = () => `
  <p class="center" id="fmsg" style="font-size:1.25rem">Écoute bien… 👂</p>
  <div class="farm">${FARM.map((a, i) => `<button class="fbtn" data-f="${i}" style="background:${a.c}" disabled aria-label="Animal ${i + 1}">${a.e}</button>`).join('')}</div>
  <p class="tiny" id="fprog"></p>
  <button class="btn white" id="flisten" hidden>▶️ Écouter la suite</button>
  <section class="card center" style="padding:12px"><p>C’est au tour de</p><div id="holder">${tag(S.players[S.R.order[S.R.holder]])}</div></section>`;
AFTER.fermePlay = () => {
  const F = S.R.farm, btns = [...document.querySelectorAll('.fbtn')], msg = $('#fmsg'), listen = $('#flisten'), prog = $('#fprog');
  const lock = v => btns.forEach(b => { b.disabled = v; });
  const light = i => { const b = btns[i]; b.classList.add('lit'); FARM[i].s(); later(() => b.classList.remove('lit'), 380); };
  const play = () => {
    F.phase = 'watch'; lock(true); listen.hidden = true; hush();
    msg.textContent = 'Écoute bien… 👂';
    prog.textContent = `${F.seq.length} ${F.seq.length > 1 ? 'animaux' : 'animal'} à retenir`;
    F.seq.forEach((a, k) => later(() => light(a), 600 + k * 650));
    later(() => { F.phase = 'repeat'; F.pos = 0; lock(false); msg.textContent = 'À toi ! Refais la même suite 👆'; }, 600 + F.seq.length * 650);
  };
  $('.farm').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b || F.phase !== 'repeat') return;
    const i = +b.dataset.f; light(i);
    if (i !== F.seq[F.pos]) {
      F.phase = 'done'; lock(true); later(() => SFX.buzzer(), 250);
      later(() => fail(S.R.order[S.R.holder], '🐮', 'MEUH-RATÉ !', 'La ferme s’est emmêlée chez', 'Encore une ferme ➜'), 900);
      return;
    }
    F.pos++;
    if (F.pos >= F.seq.length) {
      F.phase = 'wait'; lock(true); F.seq.push(rnd(FARM.length));
      later(() => SFX.ding(), 350);
      nextHolder();
      msg.textContent = `Bravo ! Passe le téléphone à ${nameOf(S.players[S.R.order[S.R.holder]])} 📱`;
      listen.hidden = false;
    }
  });
  listen.addEventListener('click', play);
  play();
};

/* ---------- Jacques a dit ---------- */
const jqText = it => it.j ? `Jacques a dit : ${it.o[1]} !` : `${it.o[1].charAt(0).toUpperCase() + it.o[1].slice(1)} !`;
VIEWS.jacquesPlay = () => {
  const J = S.R.jq, it = J.list[J.k];
  return `
    <span class="eyebrow">🙋 Ordre ${J.k + 1} sur ${J.list.length}</span>
    <section class="card center">
      <div class="secret" style="font-size:4.5rem" aria-hidden="true">${it.o[0]}</div>
      <p class="order-card">${it.j ? '<span class="jq-yes">Jacques a dit :</span><br>' : ''}${esc(it.o[1])} !</p>
      <p class="gage" id="jqhint" hidden>${it.j ? 'Jacques l’a dit ! Ceux qui ne l’ont pas fait sont attrapés 😏' : 'Jacques n’a rien dit ! Ceux qui ont bougé sont attrapés 😏'}</p>
    </section>
    <section class="card">
      <span class="label">Qui s’est fait attraper ?</span>
      <div class="pick">
        ${S.players.map((p, i) => `<button class="btn" data-a="jq-pick" data-v="${i}" aria-pressed="false"><span class="e">${p.emoji}</span><span class="nm">${esc(nameOf(p))}</span></button>`).join('')}
      </div>
    </section>
    <div class="row2">
      <button class="btn white small" data-a="jq-again">🔁 Répéter</button>
      <button class="btn red small" data-a="jq-next">${J.k + 1 < J.list.length ? 'Suivant ➜' : 'Résultats 🏆'}</button>
    </div>`;
};
AFTER.jacquesPlay = () => {
  S.R.jq.caught = new Set();
  const it = S.R.jq.list[S.R.jq.k];
  later(() => say(jqText(it), true), 300);
  later(() => { const h = $('#jqhint'); if (h) h.hidden = false; }, 3200);
};

/* ---------- Scores ---------- */
const MEDAL = ['🥇', '🥈', '🥉'];
VIEWS.scores = () => {
  const max = Math.max(1, ...S.players.map(p => p.score));
  const list = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.score - a.p.score);
  const last = S.round + 1 >= S.plan.length;
  let tapeRecap = '';
  if (S.R.type === 'tape' && S.R.ranking) {
    tapeRecap = `<p class="tiny">${S.R.ranking.map(([i, c]) => `${S.players[i].emoji} ${c}`).join(' · ')} tapes</p>`;
  }
  if (S.R.type === 'chrono' && S.R.ranking) {
    tapeRecap = `<p class="tiny center">${S.R.ranking.map(([i]) => `${S.players[i].emoji} ${fmt(S.R.times[i])} s`).join(' · ')}</p>`;
  }
  if (S.R.type === 'vue' && S.R.ranking) {
    tapeRecap = `<p class="tiny center">${S.R.ranking.map(([i, c]) => `${S.players[i].emoji} ${c}`).join(' · ')} paires</p>`;
  }
  if (S.R.type === 'jacques' && S.R.ranking) {
    tapeRecap = `<p class="tiny center">Attrapés : ${S.R.ranking.map(([i, c]) => `${S.players[i].emoji} ${c} fois`).join(' · ')}</p>`;
  }
  return `
    <span class="eyebrow">Après la manche ${S.round + 1} sur ${S.plan.length}</span>
    <h2 class="title">Les points</h2>
    ${tapeRecap}
    <section class="card">
      ${list.map(({ p, i }) => `
        <div class="score-row">
          <span class="e">${p.emoji}</span>
          <span class="nm">${esc(nameOf(p))}</span>
          <span><span class="pts">${p.score}</span>${S.last[i] ? `<span class="delta">+${S.last[i]}</span>` : ''}</span>
          <div class="sbar"><i data-w="${p.score / max * 100}" style="width:0"></i></div>
        </div>`).join('')}
    </section>
    <button class="btn ${last ? 'red' : ''}" data-a="next-round">${last ? 'Qui a gagné ? 🥁' : 'Manche suivante ➜'}</button>`;
};
AFTER.scores = () => {
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('.sbar > i').forEach(el => { el.style.width = el.dataset.w + '%'; })));
  const lead = S.players.slice().sort((a, b) => b.score - a.score)[0];
  say(`${nameOf(lead)} est en tête avec ${lead.score} point${lead.score > 1 ? 's' : ''} !`);
};

/* ---------- Roulement de tambour + podium ---------- */
VIEWS.drum = () => `<div class="bigicon" aria-hidden="true">🥁</div><h2 class="title">Roulement de tambour…</h2>`;
AFTER.drum = () => {
  let k = 0;
  every(() => { tone(90 + rnd(20), 60, .08, 'triangle', .35); k++; }, 70);
  say('Roulement de tambour !');
  later(() => go('podium'), 2400);
};
VIEWS.podium = () => {
  const list = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.score - a.p.score);
  const top = list[0].p.score, winners = list.filter(x => x.p.score === top);
  const titles = shuffle(TITLES);
  return `
    <div class="crown" aria-hidden="true">👑</div>
    <div class="champ" aria-hidden="true">${winners.map(w => w.p.emoji).join('')}</div>
    <h2 class="title">${winners.length > 1 ? 'Égalité ! Bravo à ' : 'Bravo '}${winners.map(w => esc(nameOf(w.p))).join(' et ')} !</h2>
    <p class="center">${top} points · ${winners.length > 1 ? 'Champions' : 'Champion·ne'} de la Patate Party</p>
    <section class="card">
      <span class="label">Tout le monde gagne une médaille</span>
      ${list.map(({ p }, k) => `
        <div class="award"><span class="e">${MEDAL[k] || '🏅'}</span>
          <div><b>${p.emoji} ${esc(nameOf(p))}</b> · ${p.score} pts<small>${titles[k % titles.length][0]} ${titles[k % titles.length][1]}</small></div></div>`).join('')}
    </section>
    <button class="btn red" data-a="again">Rejouer ! 🔁</button>
    <button class="btn white small" data-a="home">Changer les joueurs</button>`;
};
AFTER.podium = () => {
  SFX.fanfare(); confetti(); later(() => confetti(120), 1200);
  const list = S.players.slice().sort((a, b) => b.score - a.score);
  const top = list[0].score, w = list.filter(p => p.score === top).map(nameOf);
  later(() => say(`Et le gagnant est… ${w.join(' et ')} ! Bravo à toute la famille !`), 300);
};

/* ====================== Actions ====================== */
const ACT = {
  ava(v) { const p = S.players[v]; p.emoji = AVATARS[(AVATARS.indexOf(p.emoji) + 1) % AVATARS.length]; SFX.pop(); save(); render(); },
  kid(v) { S.players[v].kid = !S.players[v].kid; SFX.pop(); save(); render(); },
  del(v) { S.players.splice(+v, 1); save(); render(); },
  add() {
    const used = S.players.map(p => p.emoji), e = AVATARS.find(a => !used.includes(a)) || '🙂';
    S.players.push({ name: '', emoji: e, kid: false, score: 0 }); save(); render();
    const inp = document.getElementById('pname-' + (S.players.length - 1)); if (inp) inp.focus();
  },
  rounds(v) { S.rounds = +v; save(); keepScroll(render); },
  'pick-game'(k) {
    const cur = picked(), i = cur.indexOf(k);
    i >= 0 ? cur.splice(i, 1) : cur.push(k);
    S.picked = Object.keys(GAMES).filter(g => cur.includes(g));
    SFX.pop(); save(); keepScroll(render);
  },
  'pick-all'() { S.picked = null; SFX.pop(); save(); keepScroll(render); },
  'pick-none'() { S.picked = []; SFX.pop(); save(); keepScroll(render); },
  tts() { S.tts = !S.tts; save(); render(); if (S.tts) say('Je lirai les règles à voix haute !'); else hush(); },
  start() { if (!picked().length) return; ac(); SFX.yay(); startGame(); },
  reread() { const t = S.plan[S.round]; say(GAMES[t].name + '. ' + gameRules(t), true); },
  'round-go'() { hush(); startRound(); },

  'patate-go'() {
    S.R.cat = draw('cat', CATS);
    S.R.holder = 0;
    S.R.fuse = 18000 + rnd(20000);
    say(S.R.cat[1] + ' !');
    go('patatePlay');
  },
  'oops-next'() {
    S.R.booms++;
    if (S.R.booms < 2) { S.R.order.push(S.R.order.shift()); go(S.R.type + 'Ready'); }
    else endRound();
  },
  'ballon-go'() {
    S.R.bal = { pumps: 0, turn: 0, limit: 6 + rnd(13), popped: false };
    S.R.holder = 0; say('Gonfle le ballon !'); go('ballonPlay');
  },
  'croco-go'() {
    S.R.croc = { bad: rnd(10), gone: [], done: false };
    S.R.holder = 0; SFX.growl(); say('Attention au crocodile !'); go('crocoPlay');
  },
  'reflex-go'() { S.R.rx = { turn: 0, turns: 5, wins: {}, live: false }; go('reflexPlay'); },
  'chrono-start'() { go('chronoRun'); },
  'chrono-next'() {
    S.R.step++;
    if (S.R.step < S.players.length) go('chronoPass');
    else finishRanked(Object.entries(S.R.times).map(([i, t]) => [+i, Math.abs(t - 10)]), 'low');
  },

  'defi-next'() { SFX.boing(); S.R.step++; render(); },
  'defi-vote'() { go('defiCount'); },
  'defi-pick'(v) {
    v = +v; const k = S.R.votes.indexOf(v);
    k >= 0 ? S.R.votes.splice(k, 1) : S.R.votes.push(v);
    SFX.pop(); render();
  },
  'defi-ok'() { if (!S.R.votes.length) return; S.R.votes.forEach(i => give(i, 2)); endRound(); },

  'tape-ready'() { hush(); go('tapeCount'); },
  'tape-next'() { S.R.step++; if (S.R.step < S.players.length) go('tapePass'); else finishTape(); },

  'vue-ready'() { hush(); go('vueGo'); },
  'vue-next'() {
    S.R.step++;
    if (S.R.step < S.players.length) go('vuePass');
    else finishRanked(Object.entries(S.R.vue).map(([i, c]) => [+i, c]), 'high');
  },
  'trois-ready'() { S.R.trois = draw('trois', TROIS); go('troisGo'); },
  'trois-stop'() { SFX.ding(); go('troisJudge'); },
  'trois-yes'() { give(S.R.order[S.R.step % S.players.length], 2); SFX.yay(); buzz(80); troisAdvance(); },
  'trois-no'() { SFX.boing(); troisAdvance(); },
  'ferme-go'() {
    S.R.farm = { seq: [rnd(FARM.length), rnd(FARM.length)], pos: 0, phase: 'watch' };
    S.R.holder = 0; go('fermePlay');
  },
  'jq-pick'(v, b) {
    const c = S.R.jq.caught, i = +v;
    c.has(i) ? c.delete(i) : c.add(i);
    b.classList.toggle('on', c.has(i)); b.setAttribute('aria-pressed', c.has(i));
    SFX.pop();
  },
  'jq-again'() { say(jqText(S.R.jq.list[S.R.jq.k]), true); },
  'jq-next'() {
    const J = S.R.jq;
    J.caught.forEach(i => { J.errors[i] = (J.errors[i] || 0) + 1; });
    J.k++;
    if (J.k < J.list.length) go('jacquesPlay');
    else finishRanked(S.players.map((_, i) => [i, J.errors[i] || 0]), 'low');
  },
  'next-round'() {
    S.round++;
    if (S.round < S.plan.length) go('intro'); else go('drum');
  },
  again() { startGame(); },
  home() { go('setup'); }
};

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.a];
  if (fn) fn(b.dataset.v, b);
});
$app.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[data-i]')) { S.players[+t.dataset.i].name = t.value.slice(0, 16); save(); }
});

/* ---------- Le bouton prout ---------- */
const prout = document.getElementById('prout');
prout.addEventListener('click', () => {
  SFX.fart(); buzz([40, 30, 60]);
  prout.classList.remove('puff'); void prout.offsetWidth; prout.classList.add('puff');
  const c = document.createElement('div'); c.className = 'cloud'; c.textContent = '💨';
  const r = prout.getBoundingClientRect();
  c.style.left = (r.left - 10) + 'px'; c.style.top = (r.top - 10) + 'px';
  document.body.appendChild(c); setTimeout(() => c.remove(), 1200);
});

load();
render();
})();
</script>
