const PER_MANCHE = 6; // 5 dilemmes + 1 dilemme maison
const PLEA_SECONDS = 30;

/* =========================================================
   ÉTAT
   ========================================================= */
const KEY = "grand-dilemme-v1";
let S = null;
let draft = { names: ["", ""], mode: "progressif", manches: 4 };
let quitAsk = false;
let timer = null;

const save = () => { try { if (S) localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const clearSave = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sd = i => (i === 0 ? "a" : "b");
const oth = i => 1 - i;
const N = i => esc(S.names[i]);
const pts = n => `${n > 0 ? "+" : ""}${n} pt${Math.abs(n) > 1 ? "s" : ""}`;

function levelFor(m) {
  if (S.mode !== "progressif") return S.mode;
  if (S.manches <= 1) return "complice";
  return ["leger", "complice", "epice"][Math.round((m * 2) / (S.manches - 1))];
}

function draw(level) {
  const pool = BANK[level].d;
  S.used[level] = S.used[level] || [];
  if (S.used[level].length >= pool.length) S.used[level] = [];
  const free = pool.map((_, i) => i).filter(i => !S.used[level].includes(i));
  const i = rnd(free); S.used[level].push(i); return i;
}

function startGame(names, mode, manches) {
  S = {
    names, mode, manches, manche: 0, q: 0,
    scores: [0, 0], mScores: [[0, 0]], used: {},
    stats: { same: 0, dilemmas: 0, guessOk: [0, 0], guessTot: [0, 0], pleas: [0, 0], customOk: [0, 0], customTot: [0, 0] },
    cur: null, screen: "mancheIntro",
  };
  newQuestion();
}

function newQuestion() {
  const level = levelFor(S.manche);
  const custom = S.q === PER_MANCHE - 1;
  const first = (S.manche + S.q) % 2;
  let flow;
  if (custom) {
    const w = S.manche % 2; // l'auteur du dilemme maison alterne à chaque manche
    flow = [
      { k: "handoff", p: w }, { k: "write", p: w }, { k: "guess", p: w },
      { k: "handoff", p: oth(w) }, { k: "self", p: oth(w) }, { k: "reveal" },
    ];
    S.cur = { level, custom: true, writer: w, opts: ["", ""], self: [null, null], guess: [null, null], flow, i: 0 };
  } else {
    const s = oth(first);
    flow = [
      { k: "handoff", p: first }, { k: "self", p: first }, { k: "guess", p: first },
      { k: "handoff", p: s }, { k: "self", p: s }, { k: "guess", p: s }, { k: "reveal" },
    ];
    const idx = draw(level);
    S.cur = { level, custom: false, idx, opts: BANK[level].d[idx], self: [null, null], guess: [null, null], flow, i: 0 };
  }
}

const step = () => S.cur.flow[S.cur.i];

/* =========================================================
   RENDU
   ========================================================= */
const app = document.getElementById("app");

function scorebar() {
  const lv = LEVELS[levelFor(S.manche)];
  const done = S.manche * PER_MANCHE + S.q;
  return `<div class="stack">
    <div class="scorebar">
      <div class="pl a"><span class="n">${N(0)}</span><span class="s">${S.scores[0]}</span></div>
      <div class="mid"><span class="tag" style="background:${lv.color}">${lv.label}</span><br>Manche ${S.manche + 1}/${S.manches} · ${Math.min(S.q + 1, PER_MANCHE)}/${PER_MANCHE}</div>
      <div class="pl b"><span class="n">${N(1)}</span><span class="s">${S.scores[1]}</span></div>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(done / (S.manches * PER_MANCHE)) * 100}%"></i></div>
  </div>`;
}

function footer() {
  if (quitAsk) return `<div class="card"><p><strong>Quitter la partie ?</strong> Les scores seront perdus.</p>
    <div class="confirm"><button class="btn ghost" data-act="quit-no">Continuer</button><button class="btn" style="background:var(--bad);color:#fff" data-act="quit-yes">Quitter</button></div></div>`;
  return `<div class="foot"><button class="linkbtn" data-act="quit">Quitter la partie</button></div>`;
}

function doors(sel, cls = "") {
  const o = S.cur.opts;
  return `<div class="doors ${sel !== null ? "chosen" : ""}">
    <button class="door A ${cls}" data-act="pick" data-v="0" aria-pressed="${sel === 0}"><span class="k">A</span><span>${esc(o[0])}</span></button>
    <span class="ou" aria-hidden="true">OU</span>
    <button class="door B ${cls}" data-act="pick" data-v="1" aria-pressed="${sel === 1}"><span class="k">B</span><span>${esc(o[1])}</span></button>
  </div>`;
}

function render() {
  if (timer) { clearInterval(timer); timer = null; }
  const key = S ? S.screen + (S.cur ? S.cur.i : "") : "setup";
  const changed = render.last !== key; render.last = key;
  if (!S) renderSetup();
  else ({ mancheIntro, play: renderStep, sentence: renderSentence, end: renderEnd })[S.screen]();
  if (changed) window.scrollTo(0, 0);
}

function renderSetup() {
  const saved = load();
  const resume = saved && saved.screen && saved.screen !== "end";
  const d = draft;
  const chip = (k, label, desc, color) => `<button class="chip" data-act="mode" data-v="${k}" aria-pressed="${d.mode === k}"><strong><span class="dot" style="background:${color}"></span>${label}</strong><span>${desc}</span></button>`;
  app.innerHTML = `
    <header class="hero">
      <span class="eyebrow">Jeu pour deux · un seul téléphone</span>
      <div class="logo" aria-label="Le Grand Dilemme"><span class="la">Le Grand</span><span class="lo">ou</span><span class="lb">Dilemme</span></div>
      <p class="muted">Tu préfères… ? Chacun choisit pour lui et parie sur le choix de l'autre. À la fin de chaque manche, le gagnant choisit le gage du perdant.</p>
    </header>
    ${resume ? `<div class="card"><p><strong>Partie en cours</strong> entre ${esc(saved.names[0])} et ${esc(saved.names[1])} · ${saved.scores[0]} à ${saved.scores[1]}</p><button class="btn" data-act="resume">Reprendre la partie</button></div>` : ""}
    <section class="card">
      <h3>Les joueurs</h3>
      <div class="names">
        <div class="field f1"><label for="n1">Joueur 1</label><input id="n1" maxlength="16" placeholder="Prénom" value="${esc(d.names[0])}" autocomplete="off"></div>
        <div class="field f2"><label for="n2">Joueur 2</label><input id="n2" maxlength="16" placeholder="Prénom" value="${esc(d.names[1])}" autocomplete="off"></div>
      </div>
    </section>
    <section class="card">
      <h3>L'ambiance</h3>
      <div class="grid2">
        ${chip("progressif", "Progressif", "De léger à épicé", "linear-gradient(90deg,var(--lv-leger),var(--lv-epice))")}
        ${chip("leger", "Léger", LEVELS.leger.desc, LEVELS.leger.color)}
        ${chip("complice", "Complice", LEVELS.complice.desc, LEVELS.complice.color)}
        ${chip("epice", "Épicé", LEVELS.epice.desc, LEVELS.epice.color)}
        <button class="chip xt" data-act="mode" data-v="extreme" aria-pressed="${d.mode === "extreme"}"><strong>Extrême · 18+</strong><span>Dilemmes impossibles, questions hard, gages sans pitié. Pari raté : −1.</span></button>
      </div>
      ${d.mode === "extreme" ? `<p class="warn">Réservé aux adultes consentants. Chacun peut dire stop à tout moment : un gage refusé se remplace par un autre, sans discussion.</p>` : ""}
      <h3>Nombre de manches</h3>
      <div class="seg">${[3, 4, 5].map(n => `<button class="chip" data-act="manches" data-v="${n}" aria-pressed="${d.manches === n}"><strong>${n} manches</strong><span>~${n * 10} min</span></button>`).join("")}</div>
    </section>
    <button class="btn" data-act="start">Lancer la partie</button>
    <section class="card">
      <h3>Les règles</h3>
      <ol class="rules">
        <li>Un dilemme s'affiche. En secret, tu choisis <strong>pour toi</strong>, puis tu paries sur ce que <strong>l'autre</strong> a choisi. Pari juste : +1.</li>
        <li>En mode <strong>Extrême</strong>, un pari raté coûte −1 point.</li>
        <li>Dernier tour de chaque manche : <strong>le dilemme maison</strong>. L'un invente un dilemme et parie sur la réponse de l'autre : +2 si c'est juste.</li>
        <li>Fin de manche : le gagnant choisit le gage du perdant parmi trois.</li>
      </ol>
    </section>`;
}

function mancheIntro() {
  const lv = LEVELS[levelFor(S.manche)];
  app.innerHTML = `${scorebar()}
    <div class="handoff" style="background:var(--surface);border:1px solid var(--line)">
      <span class="eyebrow">Manche ${S.manche + 1} sur ${S.manches}</span>
      <div class="big" style="color:${lv.color}">${lv.label}</div>
      <p class="muted">${lv.desc}. 5 dilemmes, puis le dilemme maison de ${N(S.manche % 2)}.</p>
    </div>
    <button class="btn" data-act="advance">C'est parti</button>${footer()}`;
}

function renderStep() {
  const st = step(), c = S.cur;
  if (st.k === "reveal") return renderReveal();
  const p = st.p, cls = sd(p), btn = cls === "a" ? "p1" : "p2";
  const head = `<div class="who"><span class="av ${cls}">${N(p).charAt(0).toUpperCase()}</span><strong>${N(p)}</strong></div>`;
  let body = "", ok = false, extra = "";

  if (st.k === "handoff") {
    let hint;
    if (c.custom && p === c.writer) hint = `C'est le dilemme maison : tu vas inventer un dilemme pour ${N(oth(p))}. Pas de regard indiscret !`;
    else if (c.custom) hint = `${N(oth(p))} t'a préparé un dilemme maison. Réponds en toute honnêteté.`;
    else hint = `Tu vas choisir pour toi, puis parier sur le choix de ${N(oth(p))}. Écran caché !`;
    app.innerHTML = `${scorebar()}
      <div class="handoff ${cls}">
        <span class="eyebrow">Passe le téléphone à</span>
        <div class="big">${N(p)}</div><p>${hint}</p>
      </div>
      <button class="btn ${btn}" data-act="advance">Je suis ${N(p)}, j'y vais</button>${footer()}`;
    return;
  }
  if (st.k === "write") {
    ok = c.opts[0].trim() && c.opts[1].trim();
    body = `<span class="eyebrow">Dilemme maison</span>
      <p class="prompt">Invente un « Tu préfères… » pour ${N(oth(p))}. Plus c'est tordu, mieux c'est.</p>
      <div class="custom-in">
        <input id="ca" maxlength="80" placeholder="Option A" value="${esc(c.opts[0])}" autocomplete="off" aria-label="Option A">
        <span class="ou" style="margin:0" aria-hidden="true">OU</span>
        <input id="cb" maxlength="80" placeholder="Option B" value="${esc(c.opts[1])}" autocomplete="off" aria-label="Option B">
      </div>`;
    extra = `<div class="foot"><button class="linkbtn" data-act="inspire">Une idée au hasard</button><button class="linkbtn" data-act="skipcustom">Passer le dilemme maison</button></div>`;
  }
  if (st.k === "self") {
    ok = c.self[p] !== null;
    body = `<span class="eyebrow">${c.custom ? `Dilemme maison de ${N(c.writer)}` : "Pour toi"}</span>
      <p class="prompt">Tu préfères…</p>${doors(c.self[p])}`;
    if (!c.custom && c.i === 1) extra = `<div class="foot"><button class="linkbtn" data-act="skip">Autre dilemme</button></div>`;
  }
  if (st.k === "guess") {
    ok = c.guess[p] !== null;
    body = `<span class="eyebrow">Ton pari</span>
      <p class="prompt">Et ${N(oth(p))}, ${c.custom ? "va choisir" : "a choisi"} quoi d'après toi ?</p>${doors(c.guess[p])}`;
  }
  app.innerHTML = `${scorebar()}<div class="card">${head}${body}</div>
    <button class="btn ${btn}" data-act="confirm" ${ok ? "" : "disabled"}>${st.k === "write" ? "Valider mon dilemme" : "Valider en secret"}</button>${extra}${footer()}`;
}

function renderReveal() {
  const c = S.cur, o = c.opts;
  const pill = i => `<span class="pill"><span class="av ${sd(i)}">${N(i).charAt(0).toUpperCase()}</span>${N(i)}</span>`;
  let html, actions;

  if (c.custom) {
    const w = c.writer, r = oth(w), right = c.guess[w] === c.self[r];
    html = `<div class="verdict ${right ? "same" : "diff"}"><div class="w pop">${right ? "Prédiction parfaite" : "Prédiction ratée"}</div>
        <p class="muted">${right ? `${N(w)} lit en ${N(r)} comme dans un livre.` : `${N(r)} a surpris ${N(w)}.`}</p></div>
      ${[0, 1].map(k => `<div class="rdoor ${k ? "B" : "A"}"><span class="t">${esc(o[k])}</span><div class="ppl">${c.self[r] === k ? pill(r) : ""}</div></div>`).join("")}
      <div class="preds"><div><span>Pari de ${N(w)}</span><b class="${right ? "ok" : "ko"}">${right ? pts(2) : "0 pt"}</b></div></div>`;
    actions = `<button class="btn" data-act="next">${S.q === PER_MANCHE - 1 ? "Fin de la manche" : "Dilemme suivant"}</button>`;
  } else {
    const same = c.self[0] === c.self[1];
    const g = [0, 1].map(p => c.guess[p] === c.self[oth(p)]);
    html = `<div class="verdict ${same ? "same" : "diff"}"><div class="w pop">${same ? "Même camp !" : "Désaccord !"}</div>
        <p class="muted">${same ? "Vous êtes sur la même longueur d'onde." : "Chacun son camp. Expliquez-vous !"}</p></div>
      ${[0, 1].map(k => `<div class="rdoor ${k ? "B" : "A"}"><span class="t">${esc(o[k])}</span><div class="ppl">${[0, 1].filter(p => c.self[p] === k).map(pill).join("")}</div></div>`).join("")}
      <div class="preds">${[0, 1].map(p => `<div><span>Pari de ${N(p)} sur ${N(oth(p))}</span><b class="${g[p] ? "ok" : "ko"}">${g[p] ? pts(1) : (c.level === "extreme" ? "−1 pt" : "raté")}</b></div>`).join("")}</div>`;
    actions = `<button class="btn" data-act="next">Dilemme suivant</button>`;
  }
  app.innerHTML = `${scorebar()}<div class="card">${html}</div>${actions}${footer()}`;
}

function renderTribunal() {
  const c = S.cur, t = c.trib;
  if (t.phase < 2) {
    const p = t.order[t.phase], cls = sd(p);
    const side = esc(c.opts[c.self[p]]);
    const running = t.end && Date.now() < t.end;
    const left = t.end ? Math.max(0, Math.ceil((t.end - Date.now()) / 1000)) : PLEA_SECONDS;
    app.innerHTML = `${scorebar()}
      <div class="handoff ${cls}" style="min-height:auto">
        <span class="eyebrow">Le tribunal · plaidoirie ${t.phase + 1}/2</span>
        <div class="big" style="font-size:1.8rem">${N(p)}</div>
        <p>Défends : <strong>${side}</strong></p>
        <div class="court"><div class="timer" id="tm">${left}</div></div>
      </div>
      ${running
        ? `<button class="btn ${cls === "a" ? "p1" : "p2"}" data-act="plea-done">J'ai fini ma plaidoirie</button>`
        : left === 0
          ? `<button class="btn" data-act="plea-done">${t.phase === 0 ? `Au tour de ${N(t.order[1])}` : "Place au verdict"}</button>`
          : `<button class="btn ${cls === "a" ? "p1" : "p2"}" data-act="plea-go">Lancer les 30 secondes</button>`}
      ${footer()}`;
    if (running) {
      timer = setInterval(() => {
        const l = Math.max(0, Math.ceil((t.end - Date.now()) / 1000));
        const el = document.getElementById("tm"); if (el) el.textContent = l;
        if (l === 0) render();
      }, 200);
    }
    return;
  }
  app.innerHTML = `${scorebar()}
    <div class="card">
      <span class="eyebrow">Le verdict</span>
      <h2>Quelqu'un a changé d'avis ?</h2>
      <p class="muted">Soyez honnêtes. Faire plier l'autre rapporte +2.</p>
      <div class="stack">
        <button class="gopt" data-act="verdict" data-v="0"><strong style="color:var(--p1)">${N(0)}</strong> a convaincu ${N(1)}</button>
        <button class="gopt" data-act="verdict" data-v="1"><strong style="color:var(--p2)">${N(1)}</strong> a convaincu ${N(0)}</button>
        <button class="gopt" data-act="verdict" data-v="-1">Personne ne cède, on reste chacun sur ses positions</button>
      </div>
    </div>${footer()}`;
}

function renderSentence() {
  const m = S.mScores[S.manche], lv = levelFor(S.manche), c = S.cur;
  const fillG = (txt, winner) => esc(txt).replace(/\{W\}/g, N(winner));
  if (!c.sent) {
    if (m[0] === m[1]) c.sent = { tie: true, picks: [rnd(BANK[lv].gages), rnd(BANK[lv].gages)] };
    else { const loser = m[0] < m[1] ? 0 : 1; c.sent = { tie: false, loser, choices: shuffle(BANK[lv].gages).slice(0, 3), pick: null }; }
    save();
  }
  const s = c.sent, last = S.manche === S.manches - 1;
  const head = `<span class="eyebrow">Fin de la manche ${S.manche + 1}</span>
    <h2>${m[0] === m[1] ? "Égalité parfaite" : `${N(m[0] > m[1] ? 0 : 1)} remporte la manche`}</h2>
    <div class="preds"><div><span>${N(0)}</span><b>${pts(m[0])}</b></div><div><span>${N(1)}</span><b>${pts(m[1])}</b></div></div>`;
  let body, ready = true;
  if (s.tie) {
    body = [0, 1].map(p => `<div class="sentence"><span class="eyebrow">Gage pour ${N(p)}</span><p>${fillG(s.picks[p], oth(p))}</p></div>`).join("");
  } else if (s.pick === null) {
    ready = false;
    const w = oth(s.loser);
    body = `<p><strong style="color:var(--${w === 0 ? "p1" : "p2"})">${N(w)}</strong>, choisis le gage de ${N(s.loser)} :</p>
      <div class="stack">${s.choices.map((g, i) => `<button class="gopt" data-act="sentence" data-v="${i}">${fillG(g, w)}</button>`).join("")}</div>`;
  } else {
    body = `<div class="sentence pop"><span class="eyebrow">Sentence pour ${N(s.loser)}</span><p>${fillG(s.choices[s.pick], oth(s.loser))}</p></div>`;
  }
  app.innerHTML = `${scorebar()}<div class="card">${head}${body}</div>
    ${ready ? `<button class="btn" data-act="nextManche">${last ? "Voir le verdict final" : "Gage fait, manche suivante"}</button>` : ""}${footer()}`;
}

function renderEnd() {
  clearSave();
  const [a, b] = S.scores, st = S.stats;
  const pct = st.dilemmas ? Math.round((st.same / st.dilemmas) * 100) : 0;
  const title = pct >= 75 ? "Âmes jumelles" : pct >= 55 ? "Couple bien accordé" : pct >= 35 ? "Les opposés s'attirent" : "Comme chien et chat";

    </div>
    <div class="card scorebar" style="display:grid">
      <div class="pl a"><span class="n">${N(0)}</span><span class="s">${a}</span></div><div class="mid">points</div>

    <div class="card">
      <span class="eyebrow">Dans le même camp</span>
      <div class="bignum">${pct}&thinsp;%</div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <h3>${title}</h3>
      <div class="preds">
        ${row("Dilemmes où vous étiez d'accord", `${st.same} / ${st.dilemmas}`)}
        ${[0, 1].map(p => row(`Paris justes · ${N(p)}`, `${st.guessOk[p]} / ${st.guessTot[p]}`)).join("")}
        ${[0, 1].map(p => st.customTot[p] ? row(`Dilemme maison réussi · ${N(p)}`, `${st.customOk[p]} / ${st.customTot[p]}`) : "").join("")}
      </div>
    </div>
    <button class="btn" data-act="replay">Revanche</button>
    <button class="btn ghost" data-act="home">Changer les réglages</button>`;
}

/* =========================================================
   LOGIQUE
   ========================================================= */
function scoreReveal() {
  const c = S.cur, m = S.mScores[S.manche], st = S.stats;
  const add = (p, n) => { S.scores[p] += n; m[p] += n; };
  if (c.custom) {
    const w = c.writer;
    st.customTot[w]++;
    if (c.guess[w] === c.self[oth(w)]) { add(w, 2); st.customOk[w]++; }
  } else {
    st.dilemmas++;
    if (c.self[0] === c.self[1]) st.same++;
    for (const p of [0, 1]) {
      st.guessTot[p]++;
      if (c.guess[p] === c.self[oth(p)]) { add(p, 1); st.guessOk[p]++; }
      else if (c.level === "extreme") add(p, -1);
    }
  }
}

function nextQuestion() {
  if (S.q === PER_MANCHE - 1) { S.screen = "sentence"; return; }
  S.q++; newQuestion(); S.screen = "play";
}

const INSPI = [
  ["Manger une araignée", "Embrasser une limace"], ["Ne plus jamais voir ta série préférée", "Ne plus jamais manger ton plat préféré"],
  ["Passer une nuit dans un musée", "Passer une nuit dans un zoo"], ["Que je lise tes messages", "Que je regarde ton historique internet"],
  ["Vivre chez mes parents un mois", "Vivre chez les tiens un mois"], ["Porter mes vêtements pendant une semaine", "Porter un costume de mascotte une journée"],
];

app.addEventListener("input", e => {
  if (e.target.id === "n1") draft.names[0] = e.target.value;
  if (e.target.id === "n2") draft.names[1] = e.target.value;
  if (e.target.id === "ca" || e.target.id === "cb") {
    S.cur.opts[e.target.id === "ca" ? 0 : 1] = e.target.value;
    const ok = S.cur.opts[0].trim() && S.cur.opts[1].trim();
    const b = app.querySelector('[data-act="confirm"]'); if (b) b.disabled = !ok;
    save();
  }
});

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case "mode": draft.mode = v; break;
    case "manches": draft.manches = +v; break;
    case "start": {
      const n = draft.names.map((x, i) => x.trim() || `Joueur ${i + 1}`);
      if (n[0].toLowerCase() === n[1].toLowerCase()) n[1] += " (2)";
      startGame(n, draft.mode, draft.manches); break;
    }
    case "resume": S = load(); if (S && S.screen === "tribunal") { S.screen = "play"; nextQuestion(); } break;
    case "advance":
      if (S.screen === "mancheIntro") S.screen = "play"; else S.cur.i++;
      break;
    case "pick": {
      const st = step();
      if (st.k === "self") S.cur.self[st.p] = +v; else if (st.k === "guess") S.cur.guess[st.p] = +v;
      break;
    }
    case "skip": { const c = S.cur; c.idx = draw(c.level); c.opts = BANK[c.level].d[c.idx]; c.self = [null, null]; break; }
    case "inspire": S.cur.opts = [...rnd(INSPI)]; break;
    case "skipcustom": nextQuestion(); break;
    case "confirm": {
      const st = step(), c = S.cur;
      if (st.k === "write") c.opts = c.opts.map(x => x.trim());
      c.i++;
      if (step().k === "reveal") scoreReveal();
      break;
    }
    case "next": nextQuestion(); break;
    case "sentence": S.cur.sent.pick = +v; break;
    case "nextManche":
      if (S.manche === S.manches - 1) S.screen = "end";
      else { S.manche++; S.q = 0; S.mScores.push([0, 0]); newQuestion(); S.screen = "mancheIntro"; }
      break;
    case "quit": quitAsk = true; render(); return;
    case "quit-no": quitAsk = false; render(); return;
    case "quit-yes": quitAsk = false; clearSave(); S = null; break;
    case "replay": startGame(S.names, S.mode, S.manches); break;
    case "home": draft = { names: [...S.names], mode: S.mode, manches: S.manches }; S = null; break;
  }
  quitAsk = false;
  if (S && S.screen !== "end") save();
  render();
});

render();
</script>
