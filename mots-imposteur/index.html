<title>Mot de Trop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeu d'ambiance : tout le monde a le même mot, sauf l'imposteur qui en a un très proche.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: one centred column (max 30rem), one screen at a time, like cards dealt on a table. */
:root {
  --bg: #efeaf7;
  --surface: #ffffff;
  --surface-2: #e2dbf0;
  --fg: #1e1838;
  --muted: #6a6189;
  --accent: #e2405f;      /* imposteur / actions */
  --accent-fg: #ffffff;
  --mint: #138f78;        /* civils */
  --gold: #a86a00;
  --blue: #3559c7;
  --line: #cfc6e3;
  --card-back: #2b2350;
  --card-back-2: #3b3170;
  --shadow: 0 0.6rem 1.6rem rgb(43 35 80 / 0.14);
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14112a; --surface: #211c40; --surface-2: #2d2654; --fg: #eeeaf9; --muted: #a59dc6;
    --accent: #ff6684; --accent-fg: #1a0710; --mint: #4fd1b5; --gold: #f2b84b; --blue: #8fa8ff; --line: #3a3266;
    --card-back: #382e72; --card-back-2: #4a3e92; --shadow: 0 0.6rem 1.6rem rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14112a; --surface: #211c40; --surface-2: #2d2654; --fg: #eeeaf9; --muted: #a59dc6;
  --accent: #ff6684; --accent-fg: #1a0710; --mint: #4fd1b5; --gold: #f2b84b; --blue: #8fa8ff; --line: #3a3266;
  --card-back: #382e72; --card-back-2: #4a3e92; --shadow: 0 0.6rem 1.6rem rgb(0 0 0 / 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.25rem 2.5rem;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); letter-spacing: -0.01em; }
h1 .strike { color: var(--accent); }
h2 { font-size: 1.9rem; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 34ch; }
.label { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border-radius: 1.1rem; padding: 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.85rem; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 3.25rem; padding: 0 1.25rem; border-radius: 999px;
  font-weight: 800; font-size: 1.05rem;
  background: var(--accent); color: var(--accent-fg);
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.block { width: 100%; }
.btn.small { min-height: 2.5rem; font-size: 0.95rem; padding: 0 1rem; }

/* Setup */
.player-list { display: flex; flex-direction: column; gap: 0.4rem; list-style: none; margin: 0; padding: 0; }
.player-list li { display: flex; align-items: center; gap: 0.6rem; background: var(--surface-2); border-radius: 0.8rem; padding: 0.35rem 0.35rem 0.35rem 0.85rem; }
.player-list .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.player-list .pts { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
.icon-btn { width: 2.25rem; height: 2.25rem; border-radius: 0.6rem; display: grid; place-items: center; color: var(--muted); font-size: 1.25rem; line-height: 1; }
.icon-btn:hover { background: var(--surface); color: var(--accent); }
.add-row { display: flex; gap: 0.5rem; }
.add-row input {
  flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--surface-2);
  border: 2px solid transparent; border-radius: 0.8rem; padding: 0.7rem 0.85rem;
}
.add-row input:focus { border-color: var(--accent); outline: none; }
.stepper { display: flex; align-items: center; gap: 0.75rem; }
.stepper output { font-family: var(--font-display); font-size: 1.8rem; min-width: 1.5ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .icon-btn { background: var(--surface-2); color: var(--fg); width: 2.75rem; height: 2.75rem; border-radius: 999px; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { border-radius: 999px; padding: 0.4rem 0.8rem; font-weight: 600; font-size: 0.9rem; background: var(--surface-2); color: var(--muted); border: 2px solid transparent; }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--fg); border-color: var(--mint); }
.hint { font-size: 0.875rem; color: var(--muted); }
.warn { color: var(--accent); font-weight: 600; font-size: 0.9rem; }

/* Secret card */
.deal { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; text-align: center; padding-top: 0.5rem; }
.deal .who { font-family: var(--font-display); font-size: clamp(2rem, 10vw, 2.8rem); overflow-wrap: anywhere; }
.card {
  position: relative; width: min(100%, 19rem); aspect-ratio: 5 / 7; max-width: 100%;
  border-radius: 1.4rem; user-select: none; -webkit-user-select: none; touch-action: none;
  perspective: 900px;
}
.card .face {
  position: absolute; inset: 0; border-radius: inherit; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.75rem; padding: 1.25rem;
  backface-visibility: hidden; transition: transform 0.35s cubic-bezier(.3,.7,.3,1);
  box-shadow: var(--shadow);
}
.card .back {
  background:
    repeating-linear-gradient(45deg, var(--card-back) 0 14px, var(--card-back-2) 14px 28px);
  color: #f2eefc;
}
.card .back .seal {
  width: 6rem; height: 6rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-family: var(--font-display); font-size: 3rem;
  box-shadow: 0 0 0 6px rgb(255 255 255 / 0.15);
}
.card .back .how { font-weight: 800; letter-spacing: 0.04em; background: rgb(0 0 0 / 0.35); padding: 0.35rem 0.8rem; border-radius: 999px; font-size: 0.95rem; }
.card .front { background: var(--surface); transform: rotateY(180deg); border: 3px solid var(--line); }
.card .front .word { font-family: var(--font-display); font-size: clamp(2rem, 11vw, 2.9rem); line-height: 1.05; overflow-wrap: anywhere; color: var(--fg); }
.card.open .back { transform: rotateY(-180deg); }
.card.open .front { transform: rotateY(0deg); }

/* Table */
.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; counter-reset: turn; }
.order li { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.85rem; border-radius: 0.8rem; background: var(--surface-2); font-weight: 600; }
.order li::before { counter-increment: turn; content: counter(turn); font-family: var(--font-display); color: var(--accent); min-width: 1.4ch; font-variant-numeric: tabular-nums; }
.order li.out { opacity: 0.45; text-decoration: line-through; }
.order li.out::before { content: "✕"; color: var(--muted); }
.order .first { margin-left: auto; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mint); }
.rules { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; color: var(--muted); font-size: 0.95rem; }
.rules b { color: var(--fg); }

.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.5rem; }
.vote-grid button {
  min-height: 3.5rem; border-radius: 0.9rem; background: var(--surface-2); font-weight: 700; padding: 0.5rem 0.75rem;
  border: 3px solid transparent; overflow-wrap: anywhere;
}
.vote-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }

/* Reveal */
.verdict { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding-block: 1rem; }
.verdict .badge { font-family: var(--font-display); font-size: 1.4rem; padding: 0.35rem 1.1rem; border-radius: 999px; }
.badge.imp { background: var(--accent); color: var(--accent-fg); }
.badge.civ { background: var(--mint); color: var(--bg); }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.words .w { border-radius: 1rem; padding: 0.9rem; background: var(--surface-2); display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
.words .w strong { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; overflow-wrap: anywhere; }
.words .w.civ { box-shadow: inset 0 0 0 3px var(--mint); }
.words .w.imp { box-shadow: inset 0 0 0 3px var(--accent); }
.tag { font-size: 0.75rem; font-weight: 800; padding: 0.15rem 0.55rem; border-radius: 999px; }
.tag.imp { background: var(--accent); color: var(--accent-fg); }
.tag.civ { background: var(--mint); color: var(--bg); }
.gain { color: var(--mint); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Pouvoirs */
.pw { display: inline-block; white-space: nowrap; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em; padding: 0.15rem 0.55rem; border-radius: 999px; border: 2px solid currentColor; }
.pw-def { color: var(--mint); }
.pw-atk { color: var(--accent); }
.pw-vote { color: var(--gold); }
.pw-info { color: var(--blue); }
.pw-talk { color: var(--muted); }
.pw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
.pw-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.6rem; font-size: 0.92rem; }
.pw-list li > span:nth-child(2) { flex: 1; min-width: 12rem; color: var(--muted); }
.pw-list li b { color: var(--fg); }
.pw-act { width: 100%; }
details > ul.pw-list { margin-top: 0.75rem; }
.order li .nm { min-width: 0; overflow-wrap: anywhere; }
.vote-grid button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; }
.vote-grid button[disabled] { opacity: 0.5; cursor: not-allowed; }
.vote-grid button small { font-size: 0.72rem; font-weight: 800; color: var(--mint); text-transform: uppercase; letter-spacing: 0.06em; }

.mk { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.12rem 0.5rem; border-radius: 999px; background: var(--surface); color: var(--blue); white-space: nowrap; }
.pw-big { font-family: var(--font-display); font-size: 1.6rem; padding: 0.3rem 1.2rem; border-radius: 999px; border: 3px solid currentColor; }
.power-btn { color: var(--blue); }
.inv { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.inv li { background: var(--surface); border-radius: 1rem; padding: 0.9rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
.inv li p { color: var(--muted); font-size: 0.95rem; }
.inv li.locked { opacity: 0.7; box-shadow: none; border: 2px dashed var(--line); }
.card .front .sub { color: var(--muted); font-size: 0.95rem; max-width: 22ch; }
.order li .mk { margin-left: 0.1rem; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.topbar .label { white-space: nowrap; }
.confirm { display: flex; flex-direction: column; gap: 0.6rem; background: var(--surface); border: 2px solid var(--accent); border-radius: 1rem; padding: 0.9rem; }

@media (prefers-reduced-motion: reduce) {
  .card .face, .btn { transition: none; }
}
</style>

<main id="app" aria-live="polite"></main>

<script>
(() => {
  // ---------- Paires de mots (civils / imposteur, l'ordre est tiré au hasard) ----------
  const WORDS = {
    "Cuisine": [
      "Pizza|Tarte flambée","Croissant|Pain au chocolat","Crêpe|Gaufre","Fromage|Beurre","Pâtes|Riz",
      "Sushi|Maki","Burger|Sandwich","Chocolat|Caramel","Café|Thé","Soupe|Bouillon","Frites|Chips",
      "Raclette|Fondue","Glace|Sorbet","Ketchup|Mayonnaise","Miel|Confiture","Omelette|Œuf au plat",
      "Baguette|Brioche","Yaourt|Crème dessert","Sel|Poivre","Couscous|Tajine","Macaron|Meringue"
    ],
    "Fruits & légumes": [
      "Pomme|Poire","Citron|Orange","Fraise|Framboise","Banane|Mangue","Cerise|Prune","Tomate|Poivron",
      "Carotte|Navet","Pastèque|Melon","Courgette|Concombre","Oignon|Ail","Raisin|Myrtille","Pêche|Abricot"
    ],
    "Animaux": [
      "Chat|Tigre","Chien|Loup","Lion|Panthère","Requin|Dauphin","Abeille|Guêpe","Cheval|Âne",
      "Grenouille|Crapaud","Hibou|Chouette","Souris|Rat","Pingouin|Manchot","Crocodile|Alligator",
      "Lapin|Lièvre","Papillon|Libellule","Vache|Taureau","Escargot|Limace","Corbeau|Pie","Phoque|Otarie"
    ],
    "Lieux": [
      "Plage|Piscine","Montagne|Colline","Hôpital|Clinique","École|Collège","Cinéma|Théâtre",
      "Restaurant|Cantine","Bibliothèque|Librairie","Supermarché|Épicerie","Forêt|Jungle","Église|Cathédrale",
      "Aéroport|Gare","Château|Palais","Musée|Galerie","Camping|Hôtel","Boulangerie|Pâtisserie","Lac|Étang",
      "Désert|Savane","Prison|Commissariat"
    ],
    "Objets": [
      "Stylo|Crayon","Fourchette|Cuillère","Lit|Canapé","Chaise|Tabouret","Parapluie|Imperméable",
      "Téléphone|Tablette","Montre|Réveil","Lunettes|Lentilles","Clé|Cadenas","Bougie|Lampe",
      "Valise|Sac à dos","Miroir|Fenêtre","Ciseaux|Couteau","Oreiller|Couverture","Télécommande|Manette",
      "Brosse à dents|Peigne","Casquette|Bonnet","Écharpe|Cravate","Gants|Moufles","Bague|Bracelet"
    ],
    "Métiers": [
      "Médecin|Infirmier","Pompier|Policier","Boulanger|Pâtissier","Professeur|Directeur","Pilote|Hôtesse de l'air",
      "Cuisinier|Serveur","Dentiste|Opticien","Avocat|Juge","Coiffeur|Barbier","Plombier|Électricien",
      "Facteur|Livreur","Journaliste|Écrivain","Vétérinaire|Éleveur","Astronaute|Pilote de chasse"
    ],
    "Sports & loisirs": [
      "Football|Rugby","Tennis|Badminton","Ski|Snowboard","Natation|Plongée","Basket|Handball",
      "Vélo|Trottinette","Boxe|Judo","Golf|Mini-golf","Échecs|Dames","Danse|Gymnastique",
      "Pétanque|Bowling","Surf|Planche à voile","Yoga|Méditation","Karaoké|Concert","Puzzle|Lego"
    ],
    "Transports": [
      "Voiture|Taxi","Avion|Hélicoptère","Train|Métro","Bateau|Sous-marin","Bus|Tramway",
      "Moto|Scooter","Fusée|Satellite","Camion|Tracteur","Ambulance|Camion de pompiers","Canoë|Kayak"
    ],
    "Fêtes & culture": [
      "Noël|Nouvel An","Anniversaire|Mariage","Halloween|Carnaval","Père Noël|Lutin","Vampire|Zombie",
      "Sorcière|Fée","Pirate|Viking","Chevalier|Mousquetaire","Super-héros|Robot","Licorne|Dragon",
      "Fantôme|Monstre","Magicien|Clown","Princesse|Reine","Cow-boy|Shérif"
    ],
    "Nature & météo": [
      "Pluie|Neige","Soleil|Lune","Orage|Tempête","Volcan|Geyser","Arc-en-ciel|Aurore boréale",
      "Rivière|Cascade","Fleur|Arbre","Rose|Tulipe","Étoile|Planète","Brouillard|Nuage","Sable|Galet"
    ]
  };
  const CATS = Object.keys(WORDS);

  // ---------- Pouvoirs secrets ----------
  // Gagnés en remportant une manche, gardés secrets, utilisables une fois quand on veut.
  // when : "table" = pendant le tour de parole, "vote" = pendant le vote,
  //        "vote-target" = quand on est soi-même désigné, "vote-other" = quand un autre est désigné.
  const POWERS = [
    { id: "shield",    name: "Bouclier",         kind: "def",  when: "vote-target", desc: "Quand tu es désigné au vote, ton élimination est annulée et personne ne peut plus te viser à ce tour." },
    { id: "grace",     name: "Grâce",            kind: "def",  when: "vote-other",  desc: "Quand un autre joueur est désigné au vote, tu le sauves : personne n'est éliminé à ce tour." },
    { id: "vengeance", name: "Vengeance",        kind: "atk",  when: "vote-target", desc: "Quand tu es désigné au vote, tu emportes avec toi un joueur de ton choix." },
    { id: "double",    name: "Double voix",      kind: "vote", when: "vote",        desc: "Pendant le vote, ta voix compte double." },
    { id: "judge",     name: "Juge",             kind: "vote", when: "vote",        desc: "Pendant le vote, en cas d'égalité, c'est toi qui tranches." },
    { id: "compare",   name: "Détecteur",        kind: "info", when: "table", secret: true, desc: "Choisis deux joueurs : tu apprends en secret s'ils ont le même mot." },
    { id: "mirror",    name: "Miroir",           kind: "info", when: "table", secret: true, desc: "Tu découvres en secret si tu es civil ou imposteur." },
    { id: "spy",       name: "Espion",           kind: "info", when: "table", secret: true, target: true, desc: "Choisis un joueur : tu vois son mot en secret." },
    { id: "conductor", name: "Chef d'orchestre", kind: "info", when: "table",       desc: "Tu inverses l'ordre de parole du tour." },
    { id: "last",      name: "Dernier mot",      kind: "info", when: "table",       desc: "Tu parles en dernier à ce tour, après avoir entendu tout le monde." },
    { id: "gag",       name: "Bâillon",          kind: "atk",  when: "table", target: true, desc: "Choisis un joueur : à ce tour, il doit mimer son indice sans parler." },
    { id: "chatty",    name: "Bavard",           kind: "talk", when: "table",       desc: "Tu donnes deux mots au lieu d'un à ce tour." },
    { id: "interro",   name: "Interrogateur",    kind: "talk", when: "table", target: true, desc: "Choisis un joueur : il doit répondre par oui ou par non à ta question." }
  ];
  const PW = Object.fromEntries(POWERS.map(p => [p.id, p]));
  const MAX_POWERS = 3;
  const WHEN_TXT = {
    "table": "Pendant le tour de parole",
    "vote": "Pendant le vote",
    "vote-target": "Quand tu es désigné au vote",
    "vote-other": "Quand un autre joueur est désigné au vote"
  };

  // ---------- Stockage local (joueurs, points et pouvoirs) ----------
  const KEY = "mot-de-trop-v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ players: S.players, impostors: S.impostors, cats: S.cats, used: S.used, powersOn: S.powersOn })); } catch {}
  }

  const saved = load() || {};
  const S = {
    players: (saved.players || [
      { id: 1, name: "Léa", score: 0 }, { id: 2, name: "Hugo", score: 0 },
      { id: 3, name: "Inès", score: 0 }, { id: 4, name: "Tom", score: 0 }
    ]).map(p => ({ ...p, powers: Array.isArray(p.powers) ? p.powers.filter(x => PW[x]) : [] })),
    impostors: saved.impostors || 1,
    cats: saved.cats && saved.cats.length ? saved.cats : CATS.slice(),
    used: saved.used || [],
    powersOn: saved.powersOn ?? true,
    screen: "setup",
    game: null,
    ui: {}
  };
  let nextId = Math.max(0, ...S.players.map(p => p.id)) + 1;

  // ---------- Utilitaires ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const byId = id => S.players.find(p => p.id === id);
  const nm = id => esc(byId(id).name);
  const maxImpostors = n => Math.max(1, Math.floor((n - 1) / 2));
  const pwTag = (id, extra = "") => `<span class="pw pw-${PW[id].kind}${extra}">${esc(PW[id].name)}</span>`;

  function pickPair() {
    const pool = [];
    S.cats.forEach(c => WORDS[c].forEach(p => pool.push(p)));
    let fresh = pool.filter(p => !S.used.includes(p));
    if (!fresh.length) { S.used = []; fresh = pool; }
    const p = pick(fresh);
    S.used.push(p);
    const [a, b] = shuffle(p.split("|"));
    return { civ: a, imp: b, cat: CATS.find(c => WORDS[c].includes(p)) };
  }

  // ---------- Déroulé d'une partie ----------
  function startGame() {
    const ids = shuffle(S.players.map(p => p.id));
    const imps = new Set(ids.slice(0, S.impostors));
    const roles = {};
    S.players.forEach(p => roles[p.id] = imps.has(p.id) ? "imp" : "civ");
    S.game = {
      pair: pickPair(), roles,
      alive: S.players.map(p => p.id),
      dealOrder: shuffle(S.players.map(p => p.id)),
      dealIndex: 0, round: 1, order: [], log: [], winner: null, earned: {}
    };
    newRound();
    S.ui = { seen: false };
    save();
    go("deal");
  }
  function newRound() {
    const g = S.game;
    // Effets de pouvoirs : valables seulement pour le tour en cours
    g.marks = {}; g.shielded = []; g.lastWord = null; g.vengeful = null;
    // L'ordre de parole tourne autour de la table à partir d'un joueur vivant au hasard
    const table = S.players.map(p => p.id).filter(id => g.alive.includes(id));
    const start = Math.floor(Math.random() * table.length);
    g.order = table.slice(start).concat(table.slice(0, start));
  }
  function fixOrder(order) {
    const l = S.game.lastWord;
    return l != null ? order.filter(id => id !== l).concat(l) : order;
  }
  function mark(id, txt) { const g = S.game; (g.marks[id] = g.marks[id] || []).push(txt); }
  function wordOf(id) { const g = S.game; return g.roles[id] === "imp" ? g.pair.imp : g.pair.civ; }

  function eliminate(id, chained) {
    const g = S.game;
    g.alive = g.alive.filter(x => x !== id);
    g.order = g.order.filter(x => x !== id);
    g.log.push({ id, round: g.round, role: g.roles[id] });
    const outs = (chained ? S.ui.outs : []).concat(id);
    if (!chained && g.vengeful === id && g.alive.length > 1) {
      S.ui = { outs, revenger: id };
      return go("revenge");
    }
    S.ui = { outs };
    checkWin();
    go("verdict");
  }
  function checkWin() {
    const g = S.game;
    const impLeft = g.alive.filter(x => g.roles[x] === "imp").length;
    const civLeft = g.alive.length - impLeft;
    if (impLeft === 0) g.winner = "civ";
    else if (impLeft >= civLeft) g.winner = "imp";
    if (!g.winner) return;
    g.gains = {};
    S.players.forEach(p => {
      let pts = 0;
      const won = g.roles[p.id] === g.winner;
      if (won && g.winner === "civ") pts = 2;
      if (won && g.winner === "imp") pts = g.alive.includes(p.id) ? 6 : 3;
      g.gains[p.id] = pts; p.score += pts;
      // Chaque gagnant reçoit un pouvoir secret au hasard (s'il lui reste de la place)
      if (won && S.powersOn) {
        if (p.powers.length < MAX_POWERS) {
          const pw = pick(POWERS).id;
          p.powers.push(pw);
          g.earned[p.id] = pw;
        } else g.earned[p.id] = null;
      }
    });
    save();
  }

  // ---------- Pouvoirs : contexte d'utilisation ----------
  function canUse(pw, who, ctx, voteId) {
    const w = PW[pw].when;
    if (w === "table") return ctx === "table";
    if (w === "vote") return ctx === "vote";
    if (w === "vote-target") return ctx === "vote" && voteId === who;
    if (w === "vote-other") return ctx === "vote" && voteId != null && voteId !== who;
    return false;
  }
  function backTo(ctx, voteId) {
    if (ctx === "vote") { S.ui = { voteId }; go("vote"); }
    else { S.ui = {}; go("table"); }
  }
  function announce(who, pw, msg, ctx, voteId) {
    S.ui = { who, pw, msg, ctx, voteId };
    go("announce");
  }
  function usePower(who, pw) {
    const g = S.game, p = byId(who), ctx = S.ui.ctx, voteId = S.ui.voteId;
    p.powers.splice(p.powers.indexOf(pw), 1);
    save();
    const def = PW[pw];
    if (pw === "compare") { S.ui = { ...S.ui, step: "pick", pw, picks: [] }; return render(); }
    if (def.target) { S.ui = { ...S.ui, step: "pick", pw, picks: [] }; return render(); }
    if (pw === "mirror") { S.ui = { ...S.ui, step: "result", pw, result: g.roles[who] === "imp" ? "Tu es l'imposteur" : "Tu es civil" }; return render(); }
    if (pw === "shield") {
      g.shielded.push(who); mark(who, "Bouclier");
      return announce(who, pw, `${nm(who)} se protège : son élimination est annulée. Revotez sans pouvoir le viser.`, "vote", null);
    }
    if (pw === "grace") { S.ui = { outs: [], pardon: { by: who, target: voteId } }; return go("verdict"); }
    if (pw === "vengeance") { g.vengeful = who; S.ui = {}; return eliminate(voteId); }
    if (pw === "conductor") {
      g.order = fixOrder(g.order.slice().reverse());
      return announce(who, pw, `${nm(who)} inverse l'ordre de parole. ${nm(g.order[0])} commence.`, ctx, voteId);
    }
    if (pw === "last") {
      g.lastWord = who; g.order = fixOrder(g.order); mark(who, "Dernier mot");
      return announce(who, pw, `${nm(who)} parlera en dernier à ce tour.`, ctx, voteId);
    }
    if (pw === "chatty") { mark(who, "2 mots"); return announce(who, pw, `${nm(who)} pourra donner deux mots à ce tour.`, ctx, voteId); }
    if (pw === "double") { mark(who, "Voix ×2"); return announce(who, pw, `La voix de ${nm(who)} compte double pour ce vote.`, ctx, voteId); }
    if (pw === "judge") { mark(who, "Juge"); return announce(who, pw, `En cas d'égalité, c'est ${nm(who)} qui tranche.`, ctx, voteId); }
  }
  function applyTarget(target) {
    const g = S.game, { who, pw, ctx, voteId } = S.ui;
    if (pw === "spy") { S.ui = { ...S.ui, step: "result", result: wordOf(target), resultLabel: `Le mot de ${byId(target).name}` }; return render(); }
    if (pw === "gag") { mark(target, "Mime"); return announce(who, pw, `${nm(who)} bâillonne ${nm(target)} : il doit mimer son indice à ce tour.`, ctx, voteId); }
    if (pw === "interro") { return announce(who, pw, `${nm(who)} pose une question à ${nm(target)}, qui doit répondre par oui ou par non.`, ctx, voteId); }
  }

  // ---------- Rendu ----------
  const app = $("#app");
  function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

  function render() {
    const fn = { setup: viewSetup, deal: viewDeal, table: viewTable, peek: viewPeek, vote: viewVote, verdict: viewVerdict,
      end: viewEnd, revenge: viewRevenge, power: viewPower, announce: viewAnnounce, discover: viewDiscover }[S.screen];
    app.innerHTML = fn();
    bind[S.screen] && bind[S.screen]();
  }
  const marksOf = id => ((S.game && S.game.marks && S.game.marks[id]) || []).map(t => `<span class="mk">${esc(t)}</span>`).join("");

      <section class="panel" aria-labelledby="ni">

        <details>
          <summary class="hint" style="cursor:pointer">Voir les ${POWERS.length} pouvoirs possibles</summary>
          <ul class="pw-list">${POWERS.map(p => `<li>${pwTag(p.id)}<span>${esc(p.desc)}</span></li>`).join("")}</ul>
        </details>

        </ol>

  }

  function viewDeal() {
    const g = S.game, id = g.dealOrder[g.dealIndex], p = byId(id);

        </div>` : ""}

  function viewPower() {
    const g = S.game, u = S.ui;
    const top = `<div class="topbar"><span class="label">Pouvoir secret</span>${u.step === "result" || u.step === "pick" ? "" : `<button class="btn ghost small" id="pw-close">Fermer</button>`}</div>`;
    if (!u.step) {
      return `${top}
        <h2>Qui veut utiliser un pouvoir ?</h2>

    }
    if (u.step === "gate") {
      return `${top}
        <section class="deal">
          <p class="label">Seul·e regarde l'écran</p>

    if (u.step === "pick") {

      <section class="panel">
        <span class="label">Classement</span>
        <ul class="player-list">
          ${ranked.map(p => `<li><span class="name">${esc(p.name)}</span>
            <span class="tag ${g.roles[p.id]}">${g.roles[p.id] === "imp" ? "Imposteur" : "Civil"}</span>
            ${g.gains[p.id] ? `<span class="gain">+${g.gains[p.id]}</span>` : ""}
            <span class="pts" style="padding-right:.6rem">${p.score} pt${p.score > 1 ? "s" : ""}</span></li>`).join("")}
        </ul>
      </section>
      <button class="btn block" id="again">Nouvelle manche</button>
      <button class="btn ghost block" id="to-setup">Modifier les joueurs</button>`;
  }

  function viewDiscover() {
    const g = S.game, id = S.ui.who, pw = g.earned[id];
    return `
      <div class="topbar"><span class="label">Nouveau pouvoir</span></div>
      <section class="deal">
        <p class="label">Passe le téléphone à</p>
        <p class="who">${nm(id)}</p>
        ${cardHTML(PW[pw].name, "Ton nouveau pouvoir", PW[pw].desc)}
        <p class="hint">Garde-le secret. Tu pourras l'utiliser avec « Pouvoir secret ».</p>
        <button class="btn block" id="disc-done">C'est noté</button>
      </section>`;
  }

  // ---------- Carte : maintenir appuyé pour révéler ----------
  function bindCard(onSeen) {
    const card = $("#card");
    if (!card) return;
    const open = e => { e.preventDefault(); card.classList.add("open"); onSeen && onSeen(); };
    const close = () => card.classList.remove("open");
    card.addEventListener("pointerdown", open);
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => card.addEventListener(t, close));
    card.addEventListener("contextmenu", e => e.preventDefault());
    card.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") open(e); });
    card.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") close(); });
    card.addEventListener("blur", close);
  }
  function on(sel, fn) { const el = $(sel); if (el) el.addEventListener("click", fn); }
  function each(sel, fn) { app.querySelectorAll(sel).forEach(b => b.addEventListener("click", () => fn(b))); }
  function quitBtn() { on("#quit", () => { if (S.ui.quitArmed) { S.game = null; S.ui = {}; go("setup"); } else { S.ui.quitArmed = true; $("#quit").textContent = "Sûr ? Toucher encore"; } }); }

  const bind = {
    setup() {
      $("#add-form").addEventListener("submit", e => {
        e.preventDefault();
        const input = $("#new-name"), name = input.value.trim();
        if (!name) return;
        S.players.push({ id: nextId++, name, score: 0, powers: [] });
        save(); render(); $("#new-name").focus();
      });
      each("[data-del]", b => { S.players = S.players.filter(p => p.id !== +b.dataset.del); save(); render(); });
      on("#imp-minus", () => { S.impostors = Math.max(1, S.impostors - 1); save(); render(); });
      on("#imp-plus", () => { S.impostors = Math.min(maxImpostors(S.players.length), S.impostors + 1); save(); render(); });
      on("#pw-toggle", () => { S.powersOn = !S.powersOn; save(); render(); });
      each("[data-cat]", b => {
        const c = b.dataset.cat;
        S.cats = S.cats.includes(c) ? S.cats.filter(x => x !== c) : S.cats.concat(c);
        save(); render();
      });
      on("#all-cats", () => { S.cats = S.cats.length === CATS.length ? [] : CATS.slice(); save(); render(); });
      on("#reset-scores", () => {
        if (!S.ui.resetArmed) { S.ui.resetArmed = true; return render(); }
        S.players.forEach(p => { p.score = 0; p.powers = []; }); S.ui = {}; save(); render();
      });
      on("#start", startGame);
    },
    deal() {
      quitBtn();
      bindCard(() => { if (!S.ui.seen) { S.ui.seen = true; $("#next").disabled = false; } });
      on("#next", () => {
        const g = S.game;
        if (g.dealIndex < g.dealOrder.length - 1) { g.dealIndex++; S.ui = { seen: false }; go("deal"); }
        else { S.ui = {}; go("table"); }
      });
    },
    table() {
      quitBtn();
      on("#to-vote", () => { S.ui = {}; go("vote"); });
      on("#to-peek", () => { S.ui = {}; go("peek"); });
      on("#to-power", () => { S.ui = { ctx: "table" }; go("power"); });
    },
    peek() {
      each("[data-peek]", b => { S.ui.peekId = +b.dataset.peek; render(); });
      bindCard();
      on("#back", () => { S.ui = {}; go("table"); });
      on("#back2", () => { S.ui = {}; go("table"); });
    },
    vote() {
      each("[data-vote]", b => { S.ui.voteId = +b.dataset.vote; render(); });
      on("#back", () => { S.ui = {}; go("table"); });
      on("#cancel-vote", () => { S.ui = {}; render(); });
      on("#confirm-vote", () => eliminate(S.ui.voteId));
      on("#to-power", () => { S.ui = { ctx: "vote", voteId: S.ui.voteId ?? null }; go("power"); });
    },
    power() {
      const u = S.ui;
      const close = () => backTo(u.ctx, u.voteId);
      on("#pw-close", close); on("#pw-close2", close);
      each("[data-who]", b => { S.ui.who = +b.dataset.who; S.ui.step = "gate"; render(); });
      on("#pw-show", () => { S.ui.step = "list"; render(); });
      each("[data-use]", b => usePower(u.who, byId(u.who).powers[+b.dataset.use]));
      each("[data-pick]", b => {
        const id = +b.dataset.pick;
        if (u.pw !== "compare") return applyTarget(id);
        u.picks = u.picks.includes(id) ? u.picks.filter(x => x !== id) : u.picks.concat(id);
        if (u.picks.length === 2) u.step = "result";
        render();
      });
      bindCard();
      on("#pw-done", close);
    },
    announce() { on("#ann-ok", () => backTo(S.ui.ctx, S.ui.voteId)); },
    revenge() {
      each("[data-target]", b => { S.ui.target = +b.dataset.target; render(); });
      on("#confirm-revenge", () => eliminate(S.ui.target, true));
    },
    verdict() {
      on("#to-end", () => { S.ui = {}; go("end"); });
      on("#next-round", () => { S.game.round++; newRound(); S.ui = {}; go("table"); });
    },
    end() {
      each("[data-discover]", b => { S.ui = { who: +b.dataset.discover }; go("discover"); });
      on("#again", startGame);
      on("#to-setup", () => { S.game = null; S.ui = {}; go("setup"); });
    },
    discover() {
      bindCard();
      on("#disc-done", () => { const g = S.game; (g.seen = g.seen || {})[S.ui.who] = true; S.ui = {}; go("end"); });
    }
  };

  // Garder la partie en cours si la page est mise à jour pendant qu'elle est ouverte
  window.claude?.hot?.snapshot?.(() => ({ screen: S.screen, game: S.game, ui: S.ui }));
  function start(data) {
    if (data && data.game && data.game.marks && data.game.earned) { S.game = data.game; S.screen = data.screen; S.ui = data.ui || {}; }
    render();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
