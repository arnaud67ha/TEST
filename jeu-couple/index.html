  --bg: #15121D; --surface: #211C2C; --ink: #F1EEF8; --muted: #A49DB8; --line: #362F45;

  --accent: #9C86FF; --accent-soft: #2C2547; --good: #4CC97E; --bad: #FF6B60;

html, body { height: 100%; }

}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* Boutons */
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  border: none; border-radius: 14px; padding: 16px 18px; font-weight: 700; font-size: 1.05rem;

.btn.p1 { background: var(--p1); }
.btn.p2 { background: var(--p2); }

.field.f1 label { color: var(--p1); } .field.f1 input:focus { border-color: var(--p1); outline: none; }
.field.f2 label { color: var(--p2); } .field.f2 input:focus { border-color: var(--p2); outline: none; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.seg { display: flex; gap: 6px; }
.seg .chip { flex: 1; align-items: center; text-align: center; padding: 10px 6px; }

.pl { display: flex; flex-direction: column; min-width: 0; }

.handoff.a .big { color: var(--p1); } .handoff.b .big { color: var(--p2); }

.avatar.a { background: var(--p1); } .avatar.b { background: var(--p2); }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1.2; text-wrap: balance; }
.quote { border-left: 4px solid var(--accent); padding-left: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 16px; text-align: left; font-size: 1.02rem; font-weight: 500;

.opt[aria-pressed="true"].a { border-color: var(--p1); background: var(--p1-soft); }
.opt[aria-pressed="true"].b { border-color: var(--p2); background: var(--p2-soft); }
.opt.big { font-size: 1.2rem; font-weight: 700; text-align: center; padding: 18px; }
.bet {
  display: flex; align-items: center; gap: 12px; border: 2px dashed var(--line); border-radius: 14px; padding: 12px 14px; background: transparent; text-align: left; width: 100%;

.bet[aria-pressed="true"] { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.bet .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: .8rem; }
.bet[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.bet small { display: block; color: var(--muted); font-size: .8rem; }

/* Révélation */
.verdict { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.verdict .word { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }

.ans > div { border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ans .a { background: var(--p1-soft); } .ans .b { background: var(--p2-soft); }

.ans .a .lbl { color: var(--p1); } .ans .b .lbl { color: var(--p2); }
.ans .val { font-weight: 700; overflow-wrap: anywhere; }
.pts { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.gage { border-radius: var(--radius); padding: 18px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
.gage .t { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.25; }

.final { text-align: center; display: flex; flex-direction: column; gap: 8px; }
.meter { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--p1), var(--accent), var(--p2)); }
.bignum { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.recap { display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }

.recap div span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; }

.rules { font-size: .92rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; padding-left: 18px; margin: 0; }
.foot { display: flex; justify-content: center; }
.confirm { display: flex; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .btn, .progress i { transition: none; } }

const REACT_OK = ["Télépathie confirmée.", "Vous êtes connectés en Bluetooth.", "Bien joué, rien ne t'échappe.", "Ça, c'est de l'écoute.", "Trop facile ?"];
const REACT_KO = ["Aïe. Il va falloir en parler.", "Raté ! Une explication s'impose.", "Tu pensais connaître ton couple…", "Allez, demande pourquoi.", "Hmm. Débat ouvert."];
const PATTERN = ["g", "g", "q", "g", "g", "q", "g", "g"]; // 8 questions par manche

/* =========================================================
   ÉTAT
   ========================================================= */
const KEY = "on-se-connait-v1";
let S = null;
let setupDraft = { names: ["", ""], mode: "progressif", manches: 3 };
let quitConfirm = false;

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const side = i => (i === 0 ? "a" : "b");
const other = i => 1 - i;

function levelFor(manche) {
  if (S.mode !== "progressif") return S.mode;
  const order = ["leger", "complice", "epice"];
  if (S.manches <= 1) return "complice";
  return order[Math.round((manche * 2) / (S.manches - 1))];
}

function draw(level, type) {
  const pool = type === "g" ? BANK[level].guess : BANK[level].qui;
  const k = level + type;
  S.used[k] = S.used[k] || [];
  if (S.used[k].length >= pool.length) S.used[k] = [];
  const free = pool.map((_, i) => i).filter(i => !S.used[k].includes(i));
  const idx = rnd(free);
  S.used[k].push(idx);
  return idx;
}

function startGame(names, mode, manches) {
  S = {
    names, mode, manches, manche: 0, q: 0,
    scores: [0, 0], mScores: [[0, 0]], matches: 0, total: 0, bets: [0, 0], betsWon: [0, 0],
    used: {}, cur: null, screen: "intro",
  };
  newQuestion();
  S.screen = "mancheIntro";
}

function newQuestion() {
  const type = PATTERN[S.q];
  const level = levelFor(S.manche);
  const guessIdx = PATTERN.slice(0, S.q).filter(t => t === "g").length;
  const target = (S.manche + guessIdx) % 2;
  S.cur = { type, level, idx: draw(level, type), target, answers: [null, null], bet: false, step: 0 };
}

function fill(text, partnerIdx) { return text.replace(/\{P\}/g, esc(S.names[partnerIdx])); }

/* Séquence des étapes :
   guess : handoff(cible) → answer(cible) → handoff(devin) → guess(devin) → reveal
   qui   : handoff(0) → answer(0) → handoff(1) → answer(1) → reveal */
function stepPlayer() {
  const c = S.cur;
  if (c.type === "g") return c.step < 2 ? c.target : other(c.target);
  return c.step < 2 ? 0 : 1;
}

/* =========================================================
   RENDU
   ========================================================= */
const app = document.getElementById("app");

function scorebar() {
  const lv = LEVELS[S.cur ? S.cur.level : levelFor(S.manche)];
  const done = S.manche * PATTERN.length + S.q;
  const tot = S.manches * PATTERN.length;
  return `
  <div class="stack" style="gap:10px">
    <div class="scorebar">
      <div class="pl a"><span class="n">${esc(S.names[0])}</span><span class="s">${S.scores[0]}</span></div>
      <div class="mid"><span class="level-tag" style="background:${lv.color}">${lv.label}</span><br>Manche ${S.manche + 1}/${S.manches}<br>Question ${Math.min(S.q + 1, PATTERN.length)}/${PATTERN.length}</div>
      <div class="pl b"><span class="n">${esc(S.names[1])}</span><span class="s">${S.scores[1]}</span></div>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(done / tot) * 100}%"></i></div>
  </div>`;
}

function footer() {
  if (quitConfirm) {
    return `<div class="card" style="gap:10px"><p><strong>Quitter la partie ?</strong> Les scores seront perdus.</p>
      <div class="confirm"><button class="btn ghost" data-act="quit-no">Continuer</button><button class="btn" style="background:var(--bad)" data-act="quit-yes">Quitter</button></div></div>`;
  }
  return `<div class="foot"><button class="linkbtn" data-act="quit">Quitter la partie</button></div>`;
}

const phoneSvg = cls => `<svg class="phone-ico" viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="6" width="28" height="52" rx="6" fill="none" stroke="var(--${cls === "a" ? "p1" : "p2"})" stroke-width="4"/><circle cx="32" cy="50" r="2.5" fill="var(--${cls === "a" ? "p1" : "p2"})"/><path d="M6 30h8m-4-4 4 4-4 4M58 30h-8m4-4-4 4 4 4" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

function render() {
  if (!S) return renderSetup();
  const fn = {
    mancheIntro: renderMancheIntro, handoff: renderHandoff, answer: renderAnswer,
    reveal: renderReveal, mancheEnd: renderMancheEnd, end: renderEnd,
  }[S.screen];
  const key = S.screen + (S.cur ? S.cur.step : "");
  const changed = render.last !== key;
  render.last = key;
  fn();
  if (changed) window.scrollTo(0, 0);
}

function renderSetup() {
  const saved = load();

  const d = setupDraft;
  const modeChip = (key, label, desc, color) => `

    </button>`;
  app.innerHTML = `

      <button class="btn" data-act="resume">Reprendre la partie</button></div>` : ""}
    <section class="card">
      <h3>Les joueurs</h3>

        <div class="field f2"><label for="n2">Joueur 2</label><input id="n2" maxlength="16" placeholder="Prénom" value="${esc(d.names[1])}" autocomplete="off"></div>
      </div>
    </section>
    <section class="card">
      <h3>L'ambiance</h3>
      <div class="choices">
        ${modeChip("progressif", "Progressif", "De léger à épicé, manche après manche", "var(--accent)")}
        ${modeChip("leger", "Léger", LEVELS.leger.desc, LEVELS.leger.color)}
        ${modeChip("complice", "Complice", LEVELS.complice.desc, LEVELS.complice.color)}

        ${[2, 3, 4, 5].map(n => `<button class="chip" data-act="manches" data-v="${n}" aria-pressed="${d.manches === n}"><strong>${n}</strong><span>~${n * 12} min</span></button>`).join("")}

        <li><strong>« Qui de nous deux »</strong> : chacun vote en secret. Si vous êtes d'accord, +1 chacun.</li>
        <li>À la fin de chaque manche, le perdant tire un gage.</li>
      </ol>
    </section>`;
}

function renderMancheIntro() {
  const lv = LEVELS[levelFor(S.manche)];
  app.innerHTML = `
    ${scorebar()}
    <div class="handoff" style="background:var(--accent-soft)">
      <span class="eyebrow">Manche ${S.manche + 1} sur ${S.manches}</span>
      <div class="big" style="color:${lv.color}">${lv.label}</div>
      <p class="muted">${lv.desc}. 6 questions « Devine » et 2 « Qui de nous deux ».</p>
    </div>
    <button class="btn" data-act="go">C'est parti</button>
    ${footer()}`;
}

function renderHandoff() {
  const p = stepPlayer();
  const c = S.cur;
  let hint;
  if (c.type === "g") hint = c.step === 0 ? `Tu vas répondre en secret sur toi-même. ${esc(S.names[other(p)])}, ne regarde pas !` : `À toi de deviner ce qu'a répondu ${esc(S.names[other(p)])}.`;
  else hint = `Question « Qui de nous deux ». Vote en secret, ${esc(S.names[other(p)])} ne doit pas voir.`;
  app.innerHTML = `
    ${scorebar()}
    <div class="handoff ${side(p)}">
      ${phoneSvg(side(p))}
      <span class="eyebrow">Passe le téléphone à</span>
      <div class="big">${esc(S.names[p])}</div>
      <p>${hint}</p>
    </div>
    <button class="btn ${side(p) === "a" ? "p1" : "p2"}" data-act="ready">Je suis ${esc(S.names[p])}, j'y vais</button>
    ${footer()}`;
}

function renderAnswer() {
  const c = S.cur, p = stepPlayer(), cls = side(p);
  const sel = c.answers[p];
  let head, opts, extra = "";
  if (c.type === "g") {
    const item = BANK[c.level].guess[c.idx];
    const qtxt = fill(item.q, other(c.target));
    if (p === c.target) {
      head = `<span class="eyebrow">Devine · réponds sur toi</span><div class="qtext">${qtxt}</div>`;
    } else {
      head = `<span class="eyebrow">Devine · qu'a répondu ${esc(S.names[c.target])} ?</span><div class="qtext quote">${qtxt}</div>`;
      extra = `<button class="bet" data-act="bet" aria-pressed="${c.bet}"><span class="box">${c.bet ? "✓" : ""}</span><span><strong>Je suis sûr·e de moi</strong><small>+2 si c'est juste, −1 si c'est faux</small></span></button>`;
    }
    opts = item.o.map((o, i) => `<button class="opt ${cls}" data-act="pick" data-v="${i}" aria-pressed="${sel === i}">${fill(o, other(c.target))}</button>`).join("");
  } else {
    const qtxt = BANK[c.level].qui[c.idx];
    head = `<span class="eyebrow">Qui de nous deux · vote secret</span><div class="qtext">${esc(qtxt)}</div>`;
    opts = [0, 1].map(i => `<button class="opt big ${cls}" data-act="pick" data-v="${i}" aria-pressed="${sel === i}">${esc(S.names[i])}</button>`).join("");
  }
  const canSkip = c.type === "g" ? c.step === 1 && p === c.target : c.step === 1;
  app.innerHTML = `
    ${scorebar()}
    <div class="card">
      <div class="who"><span class="avatar ${cls}">${esc(S.names[p].charAt(0).toUpperCase())}</span><strong>${esc(S.names[p])}</strong></div>
      ${head}
      <div class="opts">${opts}</div>
      ${extra}
    </div>
    <button class="btn ${cls === "a" ? "p1" : "p2"}" data-act="confirm" ${sel === null ? "disabled" : ""}>Valider en secret</button>
    ${canSkip ? `<div class="foot"><button class="linkbtn" data-act="skip">Autre question</button></div>` : ""}
    ${footer()}`;
}

function renderReveal() {
  const c = S.cur;
  let body;
  if (c.type === "g") {
    const item = BANK[c.level].guess[c.idx];
    const t = c.target, g = other(t);
    const ok = c.answers[t] === c.answers[g];
    const pts = ok ? (c.bet ? 2 : 1) : (c.bet ? -1 : 0);
    const ansT = fill(item.o[c.answers[t]], other(t));
    const ansG = fill(item.o[c.answers[g]], other(t));
    body = `
      <div class="verdict ${ok ? "ok" : "ko"}"><div class="word pop">${ok ? "Bien vu !" : "Raté !"}</div><p class="muted">${rnd(ok ? REACT_OK : REACT_KO)}</p></div>
      <div class="qtext" style="font-size:1.1rem">${fill(item.q, other(t))}</div>
      <div class="ans">
        <div class="${side(t)}"><span class="lbl">${esc(S.names[t])} a répondu</span><span class="val">${ansT}</span></div>
        <div class="${side(g)}"><span class="lbl">${esc(S.names[g])} a deviné</span><span class="val">${ansG}</span></div>
      </div>
      <p class="pts">${c.bet ? "Pari activé · " : ""}${esc(S.names[g])} ${pts > 0 ? "+" + pts : pts === 0 ? "+0" : pts} point${Math.abs(pts) > 1 ? "s" : ""}</p>`;
  } else {
    const qtxt = BANK[c.level].qui[c.idx];
    const ok = c.answers[0] === c.answers[1];
    body = `
      <div class="verdict ${ok ? "ok" : "ko"}"><div class="word pop">${ok ? "D'accord !" : "Désaccord !"}</div>
        <p class="muted">${ok ? `Pour vous deux, c'est ${esc(S.names[c.answers[0]])}.` : "Chacun a son avis. À vous de débattre !"}</p></div>
      <div class="qtext" style="font-size:1.1rem">${esc(qtxt)}</div>
      <div class="ans">
        <div class="a"><span class="lbl">${esc(S.names[0])} a voté</span><span class="val">${esc(S.names[c.answers[0]])}</span></div>
        <div class="b"><span class="lbl">${esc(S.names[1])} a voté</span><span class="val">${esc(S.names[c.answers[1]])}</span></div>
      </div>
      <p class="pts">${ok ? "+1 point chacun" : "Pas de point cette fois"}</p>`;
  }
  const last = S.q === PATTERN.length - 1;
  app.innerHTML = `${scorebar()}<div class="card">${body}</div>
    <button class="btn" data-act="next">${last ? "Voir le bilan de la manche" : "Question suivante"}</button>${footer()}`;
}

function renderMancheEnd() {
  const m = S.mScores[S.manche];
  const lvKey = levelFor(S.manche);
  let gageHtml;
  const g = (loser) => fill(rnd(BANK[lvKey].gages).replace(/\{W\}/g, "{P}"), other(loser));
  if (!S.cur.gage) {
    if (m[0] === m[1]) S.cur.gage = { tie: true, t: [g(0), g(1)] };
    else { const loser = m[0] < m[1] ? 0 : 1; S.cur.gage = { tie: false, loser, t: [g(loser)] }; }
    save();
  }
  const G = S.cur.gage;
  if (G.tie) {
    gageHtml = `<p><strong>Égalité !</strong> Gage pour les deux.</p>
      <div class="gage"><span class="eyebrow" style="color:var(--p1)">${esc(S.names[0])}</span><p class="t">${G.t[0]}</p></div>
      <div class="gage"><span class="eyebrow" style="color:var(--p2)">${esc(S.names[1])}</span><p class="t">${G.t[1]}</p></div>`;
  } else {
    gageHtml = `<div class="gage"><span class="eyebrow" style="color:var(--${G.loser === 0 ? "p1" : "p2"})">Gage pour ${esc(S.names[G.loser])}</span><p class="t">${G.t[0]}</p></div>`;
  }
  const last = S.manche === S.manches - 1;
  app.innerHTML = `
    ${scorebar()}
    <div class="card">
      <span class="eyebrow">Fin de la manche ${S.manche + 1}</span>
      <h2>${m[0] === m[1] ? "Ex æquo" : `${esc(S.names[m[0] > m[1] ? 0 : 1])} remporte la manche`}</h2>
      <div class="ans">
        <div class="a"><span class="lbl">${esc(S.names[0])}</span><span class="val">${m[0]} pt${Math.abs(m[0]) > 1 ? "s" : ""} cette manche</span></div>
        <div class="b"><span class="lbl">${esc(S.names[1])}</span><span class="val">${m[1]} pt${Math.abs(m[1]) > 1 ? "s" : ""} cette manche</span></div>
      </div>
      ${gageHtml}
      ${!G.tie ? `<div class="foot"><button class="linkbtn" data-act="regage">Tirer un autre gage</button></div>` : ""}
    </div>
    <button class="btn" data-act="nextManche">${last ? "Voir le résultat final" : "Gage fait, manche suivante"}</button>
    ${footer()}`;
}

function renderEnd() {
  clearSave();
  const [a, b] = S.scores;
  const pct = S.total ? Math.round((S.matches / S.total) * 100) : 0;
  const title = pct >= 80 ? "Télépathes certifiés" : pct >= 60 ? "Duo très complice" : pct >= 40 ? "Encore plein de choses à découvrir" : "Deux inconnus charmants";
  const winner = a === b ? null : a > b ? 0 : 1;
  app.innerHTML = `
    <div class="final">
      <span class="eyebrow">Partie terminée</span>
      <h1 style="font-size:2.2rem">${winner === null ? "Égalité parfaite" : `${esc(S.names[winner])} gagne !`}</h1>
      <p class="muted">${winner === null ? "Personne ne connaît mieux l'autre. C'est presque romantique." : `${esc(S.names[winner])} connaît le mieux ${esc(S.names[other(winner)])}. Le perdant offre le prochain dessert.`}</p>
    </div>
    <div class="scorebar card" style="flex-direction:row; display:grid">
      <div class="pl a"><span class="n">${esc(S.names[0])}</span><span class="s">${a}</span></div>
      <div class="mid">points</div>
      <div class="pl b"><span class="n">${esc(S.names[1])}</span><span class="s">${b}</span></div>
    </div>
    <div class="card">
      <span class="eyebrow">Indice de complicité</span>
      <div class="bignum">${pct}&thinsp;%</div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <h3>${title}</h3>
      <div class="recap">
        <div><span>Réponses en phase</span><span>${S.matches} / ${S.total}</span></div>
        <div><span>Paris gagnés · ${esc(S.names[0])}</span><span>${S.betsWon[0]} / ${S.bets[0]}</span></div>
        <div><span>Paris gagnés · ${esc(S.names[1])}</span><span>${S.betsWon[1]} / ${S.bets[1]}</span></div>
      </div>
    </div>
    <button class="btn" data-act="replay">Rejouer avec les mêmes réglages</button>
    <button class="btn ghost" data-act="home">Changer les réglages</button>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function scoreCurrent() {
  const c = S.cur, m = S.mScores[S.manche];
  S.total++;
  if (c.type === "g") {
    const t = c.target, g = other(t);
    const ok = c.answers[t] === c.answers[g];
    const pts = ok ? (c.bet ? 2 : 1) : (c.bet ? -1 : 0);
    S.scores[g] += pts; m[g] += pts;
    if (ok) S.matches++;
    if (c.bet) { S.bets[g]++; if (ok) S.betsWon[g]++; }
  } else if (c.answers[0] === c.answers[1]) {
    S.scores[0]++; S.scores[1]++; m[0]++; m[1]++; S.matches++;
  }
}

app.addEventListener("input", e => {
  if (e.target.id === "n1") setupDraft.names[0] = e.target.value;
  if (e.target.id === "n2") setupDraft.names[1] = e.target.value;
});

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case "mode": setupDraft.mode = v; renderSetup(); return;
    case "manches": setupDraft.manches = +v; renderSetup(); return;
    case "start": {
      const n = setupDraft.names.map((x, i) => x.trim() || (i === 0 ? "Joueur 1" : "Joueur 2"));
      if (n[0].toLowerCase() === n[1].toLowerCase()) n[1] += " (2)";
      startGame(n, setupDraft.mode, setupDraft.manches); break;
    }
    case "resume": S = load(); break;
    case "go": S.screen = "handoff"; break;
    case "ready": S.cur.step++; S.screen = "answer"; break;
    case "pick": S.cur.answers[stepPlayer()] = +v; break;
    case "bet": S.cur.bet = !S.cur.bet; break;
    case "skip": {
      const c = S.cur; c.idx = draw(c.level, c.type); c.answers = [null, null]; break;
    }
    case "confirm": {
      if (S.cur.answers[stepPlayer()] === null) return;
      S.cur.step++;
      if (S.cur.step >= 4) { scoreCurrent(); S.screen = "reveal"; } else S.screen = "handoff";
      break;
    }
    case "next":
      if (S.q === PATTERN.length - 1) { S.screen = "mancheEnd"; }
      else { S.q++; newQuestion(); S.screen = "handoff"; }
      break;
    case "regage": S.cur.gage = null; break;
    case "nextManche":
      if (S.manche === S.manches - 1) { S.screen = "end"; }
      else { S.manche++; S.q = 0; S.mScores.push([0, 0]); newQuestion(); S.screen = "mancheIntro"; }
      break;
    case "quit": quitConfirm = true; render(); return;
    case "quit-no": quitConfirm = false; render(); return;
    case "quit-yes": quitConfirm = false; clearSave(); S = null; break;
    case "replay": startGame(S.names, S.mode, S.manches); break;
    case "home": setupDraft = { names: [...S.names], mode: S.mode, manches: S.manches }; S = null; break;
  }
  quitConfirm = false;
  if (S && S.screen !== "end") save();
  render();
});

render();
</script>
