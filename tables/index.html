<title>Mes Tables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: cahier d'écolier à carreaux Seyès, une seule colonne centrée, gros boutons pour les doigts */
:root {
  --paper: #fbfcff;
  --grid: #dfe6f5;
  --margin: #f2a3b3;
  --ink: #1d2a57;
  --ink-soft: #5d6a92;
  --accent: #2f5bd8;
  --accent-ink: #ffffff;
  --chip: #eef2fc;
  --good: #1f9d55;
  --good-bg: #e2f6ea;
  --bad: #d23f3f;
  --bad-bg: #fde8e8;
  --star: #f4b400;
  --font-display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141b33; --grid: #1f2947; --margin: #6b3345; --ink: #e8ecff; --ink-soft: #9aa6cc;
    --accent: #7c9bff; --accent-ink: #0d1430; --chip: #1f2947; --good: #4fd18b; --good-bg: #173a2a;
    --bad: #ff7b7b; --bad-bg: #3f1d24; --star: #ffcb3d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141b33; --grid: #1f2947; --margin: #6b3345; --ink: #e8ecff; --ink-soft: #9aa6cc;
  --accent: #7c9bff; --accent-ink: #0d1430; --chip: #1f2947; --good: #4fd18b; --good-bg: #173a2a;
  --bad: #ff7b7b; --bad-bg: #3f1d24; --star: #ffcb3d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 46px, var(--margin) 46px, var(--margin) 48px, transparent 48px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 800; }
h1 span { color: var(--accent); }
h2 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--ink-soft); }
.label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
section { display: flex; flex-direction: column; gap: 12px; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* Choix des tables */
.tables { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.t {
  aspect-ratio: 1; max-width: 100%; border-radius: 16px;
  background: var(--chip); border: 2px solid var(--grid);
  font-family: var(--font-display); font-size: 1.7rem; font-weight: 800;
  display: grid; place-items: center; transition: transform .1s;
}
.t[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.t:active { transform: scale(.94); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.pill {
  padding: 10px 18px; border-radius: 999px; background: var(--chip); border: 2px solid var(--grid);
  font-weight: 700;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.link { background: none; color: var(--accent); font-weight: 700; padding: 4px 0; text-decoration: underline; }
.big {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 800;
  background: var(--accent); color: var(--accent-ink);
  padding: 14px 24px; border-radius: 18px; width: 100%;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000);
}
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.big:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--bad); font-weight: 700; min-height: 1.4em; }

/* Quiz */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.progress { flex: 1; height: 14px; background: var(--chip); border-radius: 999px; overflow: hidden; border: 2px solid var(--grid); }
.progress i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score b { color: var(--star); }
.quit { background: var(--chip); border-radius: 12px; padding: 6px 12px; font-weight: 700; color: var(--ink-soft); }

.equation {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(3rem, 15vw, 5.2rem); line-height: 1;
  display: flex; align-items: center; justify-content: center; gap: .25em;
  padding-block: 18px; font-variant-numeric: tabular-nums;
}
.equation .op { color: var(--accent); }
.answer {
  min-width: 2.2em; padding: .05em .2em; text-align: center;
  border-bottom: 6px solid var(--ink); color: var(--ink);
}
.answer.empty::after { content: "?"; color: var(--ink-soft); opacity: .5; }
.answer.good { color: var(--good); border-color: var(--good); }
.answer.bad { color: var(--bad); border-color: var(--bad); text-decoration: line-through; text-decoration-thickness: 5px; }
.feedback {
  min-height: 56px; border-radius: 16px; padding: 12px 16px; text-align: center;
  font-weight: 700; font-size: 1.15rem; display: grid; place-items: center;
}
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.12); } }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.k {
  font-family: var(--font-display); font-size: 2rem; font-weight: 700;
  padding: 10px 0; border-radius: 16px; background: var(--paper); border: 2px solid var(--grid);
  box-shadow: 0 4px 0 var(--grid);
}
.k:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--grid); }
.k.del { color: var(--bad); }
.k.ok { background: var(--good); color: var(--paper); border-color: var(--good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 60%, #000); }

/* Fin */
.stars { font-size: 3.4rem; letter-spacing: .1em; text-align: center; color: var(--star); line-height: 1; }
.stars .off { color: var(--grid); }
.result { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result .num { font-family: var(--font-display); font-size: 3rem; font-weight: 800; line-height: 1; }
.errors { display: flex; flex-wrap: wrap; gap: 8px; }
.errors span { background: var(--bad-bg); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.errors span b { color: var(--good); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main>
  <!-- Écran 1 : réglages -->
  <div id="setup" class="screen" style="display:flex;flex-direction:column;gap:22px">
    <header>
      <h1>Mes tables de <span>×</span></h1>
      <p class="sub">Choisis les tables, puis écris les résultats.</p>
    </header>
    <section>
      <div class="top"><span class="label">Tables à réviser</span>
        <span class="row"><button class="link" id="all">Toutes</button><button class="link" id="none">Aucune</button></span></div>
      <div class="tables" id="tables"></div>
    </section>
    <section>
      <span class="label">Nombre de questions</span>
      <div class="row" id="counts"></div>
    </section>
    <section>
      <span class="label">Ordre</span>
      <div class="row" id="orders"></div>
    </section>
    <p class="hint" id="hint"></p>
    <button class="big" id="start">C'est parti !</button>
  </div>

  <!-- Écran 2 : questions -->
  <div id="quiz" class="screen" hidden style="flex-direction:column;gap:18px">
    <div class="top">
      <button class="quit" id="quit">✕ Arrêter</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="score" id="score"><b>★</b> 0</span>
    </div>
    <div class="equation" id="eq" aria-live="polite">
      <span id="a">7</span><span class="op">×</span><span id="b">8</span><span class="op">=</span><span class="answer empty" id="ans"></span>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="pad" id="pad"></div>
  </div>

  <!-- Écran 3 : bilan -->
  <div id="end" class="screen" hidden style="flex-direction:column;gap:22px">
    <div class="stars" id="stars"></div>
    <div class="result">
      <h1 id="title">Bravo !</h1>
      <p class="num" id="final">8 / 10</p>
      <p class="sub" id="detail"></p>
    </div>
    <section id="errBox">
      <span class="label">À revoir</span>
      <div class="errors" id="errors"></div>
    </section>
    <button class="big" id="again">Rejouer</button>
    <button class="link" id="back" style="align-self:center">Changer les tables</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("tables:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("tables:" + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    tables: new Set(store.get("tables", [2, 3, 4, 5])),
    count: store.get("count", 10),
    order: store.get("order", "mix"),
  };

  // --- Réglages ---
  const tablesEl = $("tables");
  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button");
    b.className = "t"; b.textContent = n; b.id = "t" + n;
    b.setAttribute("aria-label", "Table de " + n);
    b.onclick = () => { state.tables.has(n) ? state.tables.delete(n) : state.tables.add(n); renderSetup(); };
    tablesEl.appendChild(b);
  }
  $("all").onclick = () => { for (let n = 1; n <= 10; n++) state.tables.add(n); renderSetup(); };
  $("none").onclick = () => { state.tables.clear(); renderSetup(); };

  const pills = (el, items, key) => items.forEach(([val, label]) => {
    const b = document.createElement("button");
    b.className = "pill"; b.textContent = label; b.dataset.val = val; b.id = key + "-" + val;
    b.onclick = () => { state[key] = val; renderSetup(); };
    el.appendChild(b);
  });
  pills($("counts"), [[10, "10"], [20, "20"], [30, "30"], [0, "Toutes les opérations"]], "count");
  pills($("orders"), [["mix", "Mélangé"], ["seq", "Dans l'ordre"]], "order");

  function renderSetup() {
    for (let n = 1; n <= 10; n++) $("t" + n).setAttribute("aria-pressed", state.tables.has(n));
    document.querySelectorAll("#counts .pill").forEach(b => b.setAttribute("aria-pressed", +b.dataset.val === state.count));
    document.querySelectorAll("#orders .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.val === state.order));
    $("start").disabled = state.tables.size === 0;
    $("hint").textContent = state.tables.size === 0 ? "Choisis au moins une table." : "";
    store.set("tables", [...state.tables]); store.set("count", state.count); store.set("order", state.order);
  }

  // --- Clavier numérique ---
  const pad = $("pad");
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
    const b = document.createElement("button");
    b.className = "k" + (k === "⌫" ? " del" : k === "OK" ? " ok" : "");
    b.textContent = k; b.id = "k-" + (k === "⌫" ? "del" : k.toLowerCase());
    b.setAttribute("aria-label", k === "⌫" ? "Effacer" : k === "OK" ? "Valider" : k);
    b.onclick = () => press(k === "⌫" ? "del" : k === "OK" ? "ok" : k);
    pad.appendChild(b);
  });
  document.addEventListener("keydown", e => {
    if ($("quiz").hidden) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Enter") press("ok");
  });

  // --- Partie ---
  let game = null;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildQuestions() {
    const tabs = [...state.tables].sort((x, y) => x - y);
    const all = [];
    tabs.forEach(t => { for (let m = 1; m <= 10; m++) all.push([t, m]); });
    if (state.order === "mix") {
      shuffle(all);
      // le multiplicateur peut être à gauche ou à droite
      all.forEach((q, i) => { if (Math.random() < .5) all[i] = [q[1], q[0]]; });
    }
    if (state.count === 0) return all;
    const out = [];
    while (out.length < state.count) {
      const pool = state.order === "mix" ? shuffle(all.slice()) : all;
      out.push(...pool.slice(0, state.count - out.length));
    }
    return out;
  }

  function start() {
    game = { qs: buildQuestions(), i: 0, input: "", good: 0, firstTry: 0, errors: [], locked: false, retried: false, total: 0 };
    game.total = game.qs.length;
    show("quiz"); ask();
  }

  function ask() {
    const [a, b] = game.qs[game.i];
    $("a").textContent = a; $("b").textContent = b;
    game.input = ""; game.locked = false; game.retried = false;
    $("fb").className = "feedback"; $("fb").textContent = "";
    renderAnswer();
    $("bar").style.width = (game.i / game.qs.length * 100) + "%";
  }

  function renderAnswer(cls = "") {
    const el = $("ans");
    el.textContent = game.input;
    el.className = "answer" + (game.input ? "" : " empty") + (cls ? " " + cls : "");
  }

  function press(k) {
    if (!game || game.locked) return;
    if (k === "del") { game.input = game.input.slice(0, -1); renderAnswer(); return; }
    if (k === "ok") { if (game.input) check(); return; }
    if (game.input.length < 3) { game.input += k; renderAnswer(); }
  }

  const bravo = ["Bravo !", "Super !", "Génial !", "Parfait !", "Excellent !", "Trop fort !", "Oui !"];

  function check() {
    const [a, b] = game.qs[game.i];
    const right = a * b;
    const eq = $("eq"), fb = $("fb");
    game.locked = true;
    if (+game.input === right) {
      game.good++;
      if (!game.retried) game.firstTry++;
      $("score").innerHTML = "<b>★</b> " + game.firstTry;
      renderAnswer("good");
      eq.classList.remove("pop"); void eq.offsetWidth; eq.classList.add("pop");
      fb.className = "feedback good"; fb.textContent = bravo[Math.floor(Math.random() * bravo.length)];
      setTimeout(next, 800);
    } else {
      renderAnswer("bad");
      eq.classList.remove("shake"); void eq.offsetWidth; eq.classList.add("shake");
      fb.className = "feedback bad";
      if (!game.retried) {
        // une deuxième chance
        game.retried = true;
        fb.textContent = "Presque ! Essaie encore.";
        setTimeout(() => { game.input = ""; renderAnswer(); game.locked = false; }, 900);
      } else {
        fb.textContent = a + " × " + b + " = " + right;
        game.errors.push([a, b]);
        // la question revient plus tard
        game.qs.push([a, b]);
        setTimeout(next, 2200);
      }
    }
  }

  function next() {
    game.i++;
    if (game.i >= game.qs.length) finish(); else ask();
  }

  function finish() {
    $("bar").style.width = "100%";
    const ratio = game.firstTry / game.total;
    const n = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
    $("stars").innerHTML = [0,1,2].map(i => i < n ? "★" : '<span class="off">★</span>').join("");
    $("title").textContent = n === 3 ? "Champion !" : n === 2 ? "Très bien !" : "Continue, tu progresses !";
    $("final").textContent = game.firstTry + " / " + game.total;
    $("detail").textContent = "bonnes réponses du premier coup";
    const uniq = [...new Map(game.errors.map(([a, b]) => [Math.min(a,b) + "x" + Math.max(a,b), [a, b]])).values()];
    $("errBox").hidden = uniq.length === 0;
    $("errors").innerHTML = uniq.map(([a, b]) => `<span>${a} × ${b} = <b>${a * b}</b></span>`).join("");
    show("end");
  }

  function show(id) {
    ["setup", "quiz", "end"].forEach(s => { const el = $(s); el.hidden = s !== id; if (s === id) el.style.display = "flex"; });
  }

  $("start").onclick = start;
  $("again").onclick = start;
  $("back").onclick = () => show("setup");
  $("quit").onclick = () => { game = null; show("setup"); };

  renderSetup();
})();
</script>
