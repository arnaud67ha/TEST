<title>Compteur Triominos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one narrow column, like a score pad on the table: scores, the current turn, then the log. */
:root {
  --bg: #e9eef0;
  --surface: #ffffff;
  --tile: #fbf7ec;
  --tile-edge: #d9cfb6;
  --fg: #1d2a30;
  --muted: #5d6e76;
  --line: #cfd9dd;
  --accent: #1f6f78;
  --accent-fg: #ffffff;
  --gold: #b7791f;
  --good: #2f7d4a;
  --bad: #b3412e;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a1e; --surface: #1b262b; --tile: #2a2a22; --tile-edge: #4a4636;
    --fg: #e6eef0; --muted: #94a6ad; --line: #2e3d44; --accent: #4fb3bd; --accent-fg: #0d1619;
    --gold: #e0a447; --good: #6cc48a; --bad: #ec7d68; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a1e; --surface: #1b262b; --tile: #2a2a22; --tile-edge: #4a4636;
  --fg: #e6eef0; --muted: #94a6ad; --line: #2e3d44; --accent: #4fb3bd; --accent-fg: #0d1619;
  --gold: #e0a447; --good: #6cc48a; --bad: #ec7d68; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.25rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.header-actions { display: flex; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-big { width: 100%; padding: 14px 18px; font-size: 1.1rem; border-radius: var(--radius); }
.btn-danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* Scoreboard */
.scores { display: flex; flex-direction: column; gap: 8px; }
.player { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 2px solid transparent; background: var(--bg); text-align: left; width: 100%; }
.player.current { border-color: var(--accent); background: var(--surface); }
.player .pname { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.player .pscore { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; grid-row: span 2; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.player.leader .bar > i { background: var(--gold); }
.tag { font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }

/* Tile entry */
.turn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile-zone { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.tile-svg { width: 132px; max-width: 40%; height: auto; flex: none; }
.tile-svg .tri { fill: var(--tile); stroke: var(--tile-edge); stroke-width: 3; }
.tile-svg text { font-family: var(--font-display); font-weight: 700; font-size: 22px; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.tile-svg text.empty { fill: var(--muted); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-width: 180px; }
.key { border: 1px solid var(--tile-edge); background: var(--tile); border-radius: 12px; padding: 12px 0; font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }
.key:hover { border-color: var(--accent); }
.key.wide { grid-column: span 3; font-family: var(--font-body); font-size: .95rem; padding: 8px 0; }

.field-label { font-weight: 700; font-size: .9rem; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: .92rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.hint { font-size: .85rem; color: var(--muted); }
.bonus-note { font-size: .9rem; color: var(--gold); font-weight: 700; }

.total { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.total .val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; }
.breakdown { font-size: .85rem; color: var(--muted); }
.row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* End of round */
.remain-list { display: flex; flex-direction: column; gap: 8px; }
.remain { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.remain input { width: 90px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; text-align: right; }

/* Log */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.log li:last-child { border-bottom: 0; }
.log .d { font-weight: 700; white-space: nowrap; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* Setup */
.setup-row { display: flex; gap: 8px; align-items: center; }
.setup-row input, .target input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.target { display: flex; gap: 10px; align-items: center; }
.target input { flex: none; width: 110px; }

/* Rules */
details.rules { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; }
details.rules summary { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; padding: 10px 0; cursor: pointer; }
.rules table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.rules td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.rules td:last-child { text-align: right; font-weight: 700; white-space: nowrap; padding-left: 12px; }
.rules h3 { font-size: 1rem; margin-top: 14px; }
.rules p { margin: 6px 0; }

.banner { background: var(--gold); color: #1d1608; border-radius: var(--radius); padding: 14px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } }
</style>

<main id="app"></main>

<script>
(function () {
  const KEY = "triominos-score-v1";
  const HEX = [
    { id: "pont", label: "Pont", pts: 40 },
    { id: "hex1", label: "Hexagone", pts: 50, group: "hex" },
    { id: "hex2", label: "Double hexagone", pts: 60, group: "hex" },
    { id: "hex3", label: "Triple hexagone", pts: 70, group: "hex" }
  ];

  let game = load();
  // Turn draft (not saved)
  let draft = freshDraft();
  let view = "turn";        // turn | end
  let endMode = "out";       // out | blocked
  let endWho = null;
  let remains = {};
  let confirmNew = false;
  let setupNames = ["Joueur 1", "Joueur 2", "Joueur 3"];
  let setupTarget = 400;

  function freshDraft() { return { nums: [], draws: 0, bonus: {} }; }

  function load() {
    try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function save() {
    try { if (game) localStorage.setItem(KEY, JSON.stringify(game)); else localStorage.removeItem(KEY); } catch (e) {}
  }
  function snapshot() {
    const copy = JSON.parse(JSON.stringify(game));
    delete copy.undo;
    game.undo.push(copy);
    if (game.undo.length > 60) game.undo.shift();
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); }

  // ---------- Scoring rules ----------
  function tileScore(d, firstMove) {
    const parts = [];
    let total = 0;
    if (d.nums.length === 3) {
      const sum = d.nums[0] + d.nums[1] + d.nums[2];
      total += sum; parts.push(`tuile ${d.nums.join("-")} = ${sum}`);
      const triple = d.nums[0] === d.nums[1] && d.nums[1] === d.nums[2];
      if (firstMove && triple) {
        const b = d.nums[0] === 0 ? 40 : 10;
        total += b; parts.push(`premier triple +${b}`);
      }
    }
    for (const h of HEX) if (d.bonus[h.id]) { total += h.pts; parts.push(`${h.label.toLowerCase()} +${h.pts}`); }
    if (d.draws) { total -= 5 * d.draws; parts.push(`${d.draws} pioche${d.draws > 1 ? "s" : ""} −${5 * d.draws}`); }
    return { total, parts };
  }

  function addScore(i, delta, label) {
    game.players[i].score += delta;
    game.log.unshift({ r: game.round, p: game.players[i].name, d: delta, t: label });
  }
  function nextPlayer() { game.cur = (game.cur + 1) % game.players.length; }

  // ---------- Actions ----------
  const actions = {
    start() {
      const names = setupNames.map(n => n.trim()).filter(Boolean);
      if (names.length < 2) return;
      game = { players: names.map(n => ({ name: n, score: 0 })), target: Math.max(50, +setupTarget || 400), cur: 0, round: 1, first: true, last: null, log: [], undo: [] };
      draft = freshDraft(); view = "turn";
    },
    key(n) { if (draft.nums.length < 3) draft.nums.push(n); },
    erase() { draft.nums.pop(); },
    draws(n) { draft.draws = n; },
    bonus(id) {
      const h = HEX.find(x => x.id === id);
      const on = !draft.bonus[id];
      if (h.group) HEX.filter(x => x.group === h.group).forEach(x => draft.bonus[x.id] = false);
      draft.bonus[id] = on;
    },
    play() {
      if (draft.nums.length !== 3) return;
      const s = tileScore(draft, game.first);
      snapshot();
      addScore(game.cur, s.total, s.parts.join(", "));
      game.first = false; game.last = game.cur;
      nextPlayer(); draft = freshDraft();
    },
    pass() {
      snapshot();
      addScore(game.cur, -25, "3 pioches sans pouvoir jouer −15, passe −10");
      nextPlayer(); draft = freshDraft();
    },
    pick(i) { game.cur = i; draft = freshDraft(); save(); },
    openEnd() { view = "end"; endMode = "out"; endWho = game.last ?? game.cur; remains = {}; },
    closeEnd() { view = "turn"; },
    endMode(m) { endMode = m; },
    endWho(i) { endWho = i; },
    applyEnd() {
      const r = i => Math.max(0, parseInt(remains[i], 10) || 0);
      const n = game.players.length;
      snapshot();
      if (endMode === "out") {
        let sum = 0;
        for (let i = 0; i < n; i++) if (i !== endWho) sum += r(i);
        addScore(endWho, 25 + sum, `fin de manche : plus de tuiles +25, tuiles des adversaires +${sum}`);
      } else {
        let best = 0;
        for (let i = 1; i < n; i++) if (r(i) < r(best)) best = i;
        let others = 0;
        for (let i = 0; i < n; i++) if (i !== best) others += r(i);
        const gain = others - r(best);
        addScore(best, gain, `manche bloquée : tuiles des adversaires ${others} − ses tuiles ${r(best)}`);
      }
      game.round += 1; game.first = true; game.last = null;
      view = "turn"; draft = freshDraft();
    },
    undo() { if (game.undo.length) { const prev = game.undo.pop(); const stack = game.undo; game = prev; game.undo = stack; draft = freshDraft(); view = "turn"; } },
    askNew() { confirmNew = true; },
    cancelNew() { confirmNew = false; },
    newGame() { if (game) { setupNames = game.players.map(p => p.name); setupTarget = game.target; } game = null; confirmNew = false; },
    addName() { if (setupNames.length < 6) setupNames.push(`Joueur ${setupNames.length + 1}`); },
    delName(i) { if (setupNames.length > 2) setupNames.splice(i, 1); }
  };

  // ---------- Rendering ----------
  function tileSVG(nums) {
    const v = i => nums[i] ?? "?";
    const cls = i => nums[i] === undefined ? "empty" : "";
    return `<svg class="tile-svg" viewBox="0 0 132 118" role="img" aria-label="Tuile ${nums.length ? nums.join(", ") : "vide"}">
      <path class="tri" d="M66 6 L126 112 L6 112 Z" stroke-linejoin="round"/>
      <text x="66" y="34" class="${cls(0)}">${v(0)}</text>
      <text x="100" y="96" class="${cls(1)}">${v(1)}</text>
      <text x="32" y="96" class="${cls(2)}">${v(2)}</text>
    </svg>`;
  }

  function rulesHTML() {
    return `<details class="rules" id="rules">
      <summary>Les règles du score, en clair</summary>
      <h3>Quand tu poses une tuile</h3>
      <p>Tu marques la somme des 3 chiffres de la tuile. Exemple : 2-4-5 rapporte 11 points.</p>
      <table>
        <tr><td>Tu formes un <b>pont</b> (ta tuile touche une autre tuile par une pointe, et le côté opposé touche le plateau)</td><td>+40</td></tr>
        <tr><td>Tu fermes un <b>hexagone</b> (6 tuiles autour d'un même point)</td><td>+50</td></tr>
        <tr><td>Tu fermes 2 hexagones d'un coup</td><td>+60</td></tr>
        <tr><td>Tu fermes 3 hexagones d'un coup</td><td>+70</td></tr>
        <tr><td>Premier coup de la manche avec un triple (5-5-5, 4-4-4…)</td><td>+10</td></tr>
        <tr><td>Premier coup avec le triple 0-0-0</td><td>+40</td></tr>
      </table>
      <h3>Quand tu ne peux pas jouer</h3>
      <table>
        <tr><td>Chaque tuile piochée (3 au maximum)</td><td>−5</td></tr>
        <tr><td>Toujours bloqué après 3 pioches : tu passes</td><td>−10 de plus</td></tr>
      </table>
      <p class="small muted">Si tu pioches puis arrives à poser, indique le nombre de pioches dans « Tuiles piochées avant de poser ». Si tu ne peux toujours pas poser après 3 pioches, appuie sur « Bloqué après 3 pioches » (−25 en tout).</p>
      <h3>À la fin de la manche</h3>
      <table>
        <tr><td>Le joueur qui pose sa dernière tuile</td><td>+25</td></tr>
        <tr><td>… et il gagne aussi la somme des chiffres des tuiles qui restent aux autres</td><td>+ total</td></tr>
        <tr><td>Si plus personne ne peut jouer : celui qui a le moins de points en main gagne la somme des autres, moins ses propres points</td><td>+ différence</td></tr>
      </table>
      <p>On joue plusieurs manches. Le premier à atteindre <b>${game ? game.target : 400} points</b> gagne la partie.</p>
      <p class="small muted">Ordre conseillé : saisis d'abord la dernière tuile posée comme un coup normal, puis appuie sur « Fin de manche ».</p>
    </details>`;
  }

  function setupHTML() {
    return `
      <header><div class="brand">${logo()}<h1>Compteur Triominos</h1></div></header>
      <section class="panel">
        <h2>Nouvelle partie</h2>
        <div class="field-label">Joueurs (2 à 6), dans l'ordre où vous jouez</div>
        ${setupNames.map((n, i) => `<div class="setup-row">
            <input id="name-${i}" data-name="${i}" value="${esc(n)}" aria-label="Nom du joueur ${i + 1}" maxlength="24">
            <button class="btn" data-a="delName" data-v="${i}" ${setupNames.length <= 2 ? "disabled" : ""} aria-label="Retirer ${esc(n)}">Retirer</button>
          </div>`).join("")}
        <button class="btn" data-a="addName" ${setupNames.length >= 6 ? "disabled" : ""}>Ajouter un joueur</button>
        <div class="target"><label class="field-label" for="target">Score à atteindre</label><input id="target" type="number" inputmode="numeric" min="50" step="50" value="${setupTarget}"></div>
        <button class="btn btn-primary btn-big" data-a="start">Commencer la partie</button>
        <p class="hint">Pour savoir qui commence : chacun pioche, celui qui a la tuile la plus forte commence. Tu pourras toucher un nom pour changer de joueur à tout moment.</p>
      </section>
      ${rulesHTML()}`;
  }

  function logo() {
    return `<svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><path d="M17 2 L32 28 L2 28 Z" fill="var(--tile)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="17" cy="11" r="2" fill="var(--accent)"/><circle cx="24" cy="23" r="2" fill="var(--accent)"/><circle cx="10" cy="23" r="2" fill="var(--accent)"/></svg>`;
  }

  function scoresHTML() {
    const max = Math.max(...game.players.map(p => p.score));
    return `<section class="scores" aria-label="Scores">
      ${game.players.map((p, i) => `
        <button class="player ${i === game.cur ? "current" : ""} ${p.score === max && max > 0 ? "leader" : ""}" data-a="pick" data-v="${i}" aria-label="${esc(p.name)}, ${p.score} points${i === game.cur ? ", c'est son tour" : ""}">
          <span class="pname">${esc(p.name)}${i === game.cur ? `<span class="tag">à toi</span>` : ""}</span>
          <span class="pscore num">${p.score}</span>
          <span class="bar"><i style="width:${Math.max(0, Math.min(100, p.score / game.target * 100))}%"></i></span>
        </button>`).join("")}
    </section>`;
  }

  function turnHTML() {
    const p = game.players[game.cur];
    const s = tileScore(draft, game.first);
    const triple = draft.nums.length === 3 && draft.nums[0] === draft.nums[1] && draft.nums[1] === draft.nums[2];
    return `<section class="panel" aria-label="Tour en cours">
      <div class="turn-head"><h2>Au tour de ${esc(p.name)}</h2><span class="muted small">Manche ${game.round}${game.first ? " · premier coup" : ""}</span></div>
      <div class="field-label">Touche les 3 chiffres de la tuile posée</div>
      <div class="tile-zone">
        ${tileSVG(draft.nums)}
        <div class="keypad">
          ${[0, 1, 2, 3, 4, 5].map(n => `<button class="key" data-a="key" data-v="${n}" ${draft.nums.length >= 3 ? "disabled" : ""}>${n}</button>`).join("")}
          <button class="key wide" data-a="erase" ${draft.nums.length ? "" : "disabled"}>Effacer le dernier chiffre</button>
        </div>
      </div>
      ${game.first && triple ? `<div class="bonus-note">Premier coup avec un triple : +${draft.nums[0] === 0 ? 40 : 10} de bonus</div>` : ""}
      <div>
        <div class="field-label">Bonus de figure (si ta tuile en a fait une)</div>
        <div class="seg" style="margin-top:6px">${HEX.map(h => `<button class="chip" data-a="bonus" data-v="${h.id}" aria-pressed="${!!draft.bonus[h.id]}">${h.label} +${h.pts}</button>`).join("")}</div>
      </div>
      <div>
        <div class="field-label">Tuiles piochées avant de poser</div>
        <div class="seg" style="margin-top:6px">${[0, 1, 2, 3].map(n => `<button class="chip" data-a="draws" data-v="${n}" aria-pressed="${draft.draws === n}">${n === 0 ? "Aucune" : n + " (−" + 5 * n + ")"}</button>`).join("")}</div>
      </div>
      <div class="total" aria-live="polite">
        <div><div class="field-label">${esc(p.name)} marque</div><div class="breakdown">${s.parts.length ? esc(s.parts.join(" · ")) : "Saisis la tuile"}</div></div>
        <div class="val num ${s.total < 0 ? "neg" : ""}">${draft.nums.length === 3 ? signed(s.total) : "…"}</div>
      </div>
      <button class="btn btn-primary btn-big" data-a="play" ${draft.nums.length === 3 ? "" : "disabled"}>Valider le coup</button>
      <div class="row-actions">
        <button class="btn" data-a="pass">Bloqué après 3 pioches (−25)</button>
        <button class="btn" data-a="openEnd">Fin de manche</button>
      </div>
    </section>`;
  }

  function endHTML() {
    const pl = game.players;
    let preview = "";
    const r = i => Math.max(0, parseInt(remains[i], 10) || 0);
    if (endMode === "out") {
      let sum = 0; pl.forEach((_, i) => { if (i !== endWho) sum += r(i); });
      preview = `${esc(pl[endWho].name)} marque <b class="num">+${25 + sum}</b> (25 + ${sum})`;
    } else {
      let best = 0; for (let i = 1; i < pl.length; i++) if (r(i) < r(best)) best = i;
      let others = 0; pl.forEach((_, i) => { if (i !== best) others += r(i); });
      preview = `${esc(pl[best].name)} a le moins de points en main et marque <b class="num">${signed(others - r(best))}</b> (${others} − ${r(best)})`;
    }
    return `<section class="panel" aria-label="Fin de manche">
      <div class="turn-head"><h2>Fin de la manche ${game.round}</h2><button class="btn" data-a="closeEnd">Annuler</button></div>
      <div class="seg">
        <button class="chip" data-a="endMode" data-v="out" aria-pressed="${endMode === "out"}">Quelqu'un n'a plus de tuiles</button>
        <button class="chip" data-a="endMode" data-v="blocked" aria-pressed="${endMode === "blocked"}">Plus personne ne peut jouer</button>
      </div>
      ${endMode === "out" ? `<div><div class="field-label">Qui a posé sa dernière tuile ?</div>
        <div class="seg" style="margin-top:6px">${pl.map((p, i) => `<button class="chip" data-a="endWho" data-v="${i}" aria-pressed="${endWho === i}">${esc(p.name)}</button>`).join("")}</div>
        <p class="hint">Pense à saisir sa dernière tuile comme un coup normal avant.</p></div>` : ""}
      <div>
        <div class="field-label">Additionne les chiffres des tuiles qui restent dans chaque main</div>
        <div class="remain-list" style="margin-top:8px">
          ${pl.map((p, i) => endMode === "out" && i === endWho ? "" : `<div class="remain"><label for="rem-${i}">${esc(p.name)}</label><input id="rem-${i}" data-rem="${i}" type="number" inputmode="numeric" min="0" placeholder="0" value="${remains[i] ?? ""}"></div>`).join("")}
        </div>
      </div>
      <div class="total"><div id="end-preview">${preview}</div></div>
      <button class="btn btn-primary btn-big" data-a="applyEnd">Enregistrer et commencer la manche ${game.round + 1}</button>
    </section>`;
  }

  function logHTML() {
    return `<section class="panel" aria-label="Historique">
      <div class="turn-head"><h2>Historique</h2><button class="btn" data-a="undo" ${game.undo.length ? "" : "disabled"}>Annuler le dernier coup</button></div>
      ${game.log.length ? `<ul class="log">${game.log.slice(0, 40).map(l => `<li><span><b>${esc(l.p)}</b> <span class="muted">· M${l.r} · ${esc(l.t)}</span></span><span class="d num ${l.d < 0 ? "neg" : "pos"}">${signed(l.d)}</span></li>`).join("")}</ul>`
        : `<p class="hint">Les coups validés apparaîtront ici. Tu peux toujours annuler une erreur.</p>`}
    </section>`;
  }

  function gameHTML() {
    const winner = game.players.filter(p => p.score >= game.target).sort((a, b) => b.score - a.score)[0];
    return `
      <header>
        <div class="brand">${logo()}<h1>Triominos</h1></div>
        <div class="header-actions">
          ${confirmNew ? `<span class="confirm"><span class="small">Effacer la partie ?</span><button class="btn btn-danger" data-a="newGame">Oui</button><button class="btn" data-a="cancelNew">Non</button></span>`
            : `<button class="btn" data-a="askNew">Nouvelle partie</button>`}
        </div>
      </header>
      ${winner ? `<div class="banner" role="status"><span>${esc(winner.name)} a atteint ${game.target} points et gagne la partie !</span></div>` : ""}
      ${scoresHTML()}
      ${view === "end" ? endHTML() : turnHTML()}
      ${logHTML()}
      ${rulesHTML()}`;
  }

  const app = document.getElementById("app");
  function render() {
    const open = document.getElementById("rules")?.open;
    app.innerHTML = game ? gameHTML() : setupHTML();
    if (open) document.getElementById("rules").open = true;
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-a]");
    if (!b || b.disabled) return;
    const a = b.dataset.a, v = b.dataset.v;
    const arg = v === undefined ? undefined : (/^\d+$/.test(v) ? +v : v);
    actions[a](arg);
    save(); render();
  });
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.name !== undefined) setupNames[+t.dataset.name] = t.value;
    else if (t.id === "target") setupTarget = t.value;
    else if (t.dataset.rem !== undefined) {
      remains[+t.dataset.rem] = t.value;
      const prev = document.getElementById("end-preview");
      const tmp = document.createElement("div"); tmp.innerHTML = endHTML();
      prev.innerHTML = tmp.querySelector("#end-preview").innerHTML;
    }
  });

  render();
})();
</script>
